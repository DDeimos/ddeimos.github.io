<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Сказочная открытка о синем драконе с белыми глазами и водорослями на голове, который бережёт обломок корабля среди морских волн." />
  <title>О благородном дракончике</title>
  <style>
    :root {
      --paper-strong: rgba(255, 250, 236, 0.98);
      --text: #26333a;
      --soft-text: #657174;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(ellipse at 76% 15%, rgba(119, 158, 166, 0.2), transparent 44%),
        radial-gradient(ellipse at 16% 84%, rgba(102, 141, 132, 0.16), transparent 45%),
        linear-gradient(155deg, #101c30 0%, #234451 54%, #627d7b 100%);
    }

    .app { width: min(100%, 480px); }

    .story-card {
      position: relative;
      width: 100%;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 18px 28px;
      border: 1px solid rgba(255, 249, 228, 0.6);
      border-radius: 34px;
      background: linear-gradient(180deg, var(--paper-strong), #dae2d9);
      box-shadow: 0 24px 70px rgba(7, 22, 35, 0.4);
      overflow: hidden;
      text-align: center;
      animation: screenIn 360ms ease both;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .top-nav { width: 100%; display: flex; justify-content: flex-start; }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 10px 15px;
      border-radius: 999px;
      color: #355967;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 18px rgba(33, 62, 67, 0.11);
      font-size: 15px;
      font-weight: 850;
      text-decoration: none;
      transition: transform 150ms ease, background 150ms ease;
    }

    .back-link:hover { background: #fffdf2; }
    .back-link:active { transform: scale(0.97); }
    .back-link:focus-visible { outline: 3px solid #4b8190; outline-offset: 4px; }

    h1 {
      max-width: 390px;
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      max-width: 100%;
      margin: 0;
      color: var(--soft-text);
      font-size: clamp(16px, 4.2vw, 18px);
      font-weight: 650;
      line-height: 1.4;
    }

    .scene {
      position: relative;
      width: min(100%, 410px);
      aspect-ratio: 21 / 22;
      flex-shrink: 0;
      border-radius: 30px;
      overflow: hidden;
      background: #173849;
      box-shadow: 0 16px 32px rgba(17, 49, 64, 0.27);
      isolation: isolate;
    }

    .scene svg { display: block; width: 100%; height: 100%; }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(238, 248, 229, 0.23);
      background: radial-gradient(ellipse at 50% 46%, transparent 48%, rgba(7, 22, 35, 0.38) 100%);
    }

    .water-control {
      position: absolute;
      z-index: 1;
      inset: 44.5% 0 0;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0 0 30px 30px;
      background: transparent;
      appearance: none;
      cursor: grab;
      touch-action: pan-y pinch-zoom;
      user-select: none;
      -webkit-user-select: none;
    }
    .water-control.is-dragging { cursor: grabbing; }
    .water-control:focus-visible { outline: 2px solid #c7e3dc; outline-offset: -5px; }
    .wave-hint { margin: 0; color: var(--soft-text); font-size: 14px; font-weight: 650; line-height: 1.4; }
    [hidden] { display: none !important; }

    .cloud { animation: cloudDrift 20s ease-in-out infinite alternate; }
    @keyframes cloudDrift { from { transform: translateX(-8px); } to { transform: translateX(13px); } }
    .star { animation: twinkle 5s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.7; } }
    .moonlight { animation: moonShimmer 6s ease-in-out infinite; }
    @keyframes moonShimmer { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.4; } }

    /* All wave paths extend past the frame so horizontal motion leaves no gaps. */
    .swell-far { animation: farSwell 9s ease-in-out infinite alternate; }
    .swell-near { animation: nearSwell 6.5s ease-in-out infinite alternate; }
    .swell-front { animation: frontSwell 7.4s ease-in-out infinite alternate; }
    @keyframes farSwell { from { transform: translate(-10px, 0); } to { transform: translate(12px, 3px); } }
    @keyframes nearSwell { from { transform: translate(12px, 2px); } to { transform: translate(-12px, -2px); } }
    @keyframes frontSwell { from { transform: translate(-14px, 2px); } to { transform: translate(14px, -3px); } }

    .dragon {
      transform-box: view-box;
      transform-origin: 211px 336px;
      animation: dragonFloat 6.5s ease-in-out infinite;
    }
    @keyframes dragonFloat {
      0%, 100% { transform: translateY(3px) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    .dragon-head { transform-box: view-box; transform-origin: 211px 266px; animation: listenToSea 11s ease-in-out infinite; }
    @keyframes listenToSea { 0%, 25%, 100% { transform: rotate(0deg); } 55%, 72% { transform: rotate(-2.5deg); } }
    .tail { transform-box: view-box; transform-origin: 254px 334px; animation: tailSway 8s ease-in-out infinite; }
    @keyframes tailSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(4deg); } }
    .fin-left { transform-box: view-box; transform-origin: 174px 294px; animation: finLeft 7s ease-in-out infinite; }
    .fin-right { transform-box: view-box; transform-origin: 250px 294px; animation: finRight 7s ease-in-out infinite; }
    @keyframes finLeft { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
    @keyframes finRight { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }

    .kelp {
      transform-box: view-box;
      transform-origin: var(--root, 210px 144px);
      animation: kelpSway var(--period, 5s) ease-in-out var(--delay, 0s) infinite alternate;
    }
    @keyframes kelpSway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    .driftwood { transform-box: fill-box; transform-origin: center; animation: woodFloat var(--period, 7s) ease-in-out var(--delay, 0s) infinite; }
    @keyframes woodFloat {
      0%, 100% { transform: translate(-3px, 2px) rotate(-4deg); }
      50% { transform: translate(4px, -3px) rotate(5deg); }
    }
    .drop { opacity: 0; animation: fallingDrop 6.5s ease-in 1.8s infinite; }
    @keyframes fallingDrop {
      0%, 55%, 100% { opacity: 0; transform: translateY(0); }
      58% { opacity: 0.7; transform: translateY(0); }
      72% { opacity: 0.5; transform: translateY(126px); }
      74%, 99% { opacity: 0; transform: translateY(132px); }
    }
    .ripple { transform-box: fill-box; transform-origin: center; animation: rippleSpread 6.5s ease-out 1.8s infinite; opacity: 0; }
    @keyframes rippleSpread {
      0%, 71%, 100% { opacity: 0; transform: scale(0.3); }
      75% { opacity: 0.6; transform: scale(0.4); }
      94%, 99% { opacity: 0; transform: scale(1.4); }
    }

    @media (max-height: 760px) {
      body { align-items: flex-start; padding-top: 10px; padding-bottom: 10px; }
      .story-card { min-height: calc(100svh - 20px); gap: 12px; padding-top: 18px; padding-bottom: 20px; }
      .scene { width: min(100%, 350px); }
      h1 { font-size: clamp(27px, 7.4vw, 36px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .story-card, .scene * { animation: none !important; }
      .back-link { transition: none; }
    }
  </style>
</head>

  <script>
  (function () {
    "use strict";

    var scene = document.getElementById("scene");
    var control = document.getElementById("waterControl");
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var svgNS = "http://www.w3.org/2000/svg";
    var backLayer = document.getElementById("backGestureWaves");
    var frontLayer = document.getElementById("frontGestureWaves");
    var rows = [
      { y: 250, depth: 0.35, layer: backLayer },
      { y: 303, depth: 0.58, layer: backLayer },
      { y: 365, depth: 0.85, layer: frontLayer },
      { y: 414, depth: 1, layer: frontLayer }
    ];
    var waves = [];
    var frameId = 0;
    var stillTimer = 0;
    var gesture = null;
    var suppressClickUntil = 0;
    var lifetime = 3.2;

    // Extra motion belongs to wrappers, leaving every original idle animation intact.
    // x is the position in the sea; cx/cy are the pivot in each actor's local coordinates.
    var floaters = [
      { id: "dragonFloat", x: 211, cx: 211, cy: 336, depth: 0.85, gain: 0.72 },
      { id: "mastFloat", x: 349, cx: 0, cy: 15, depth: 0.5, gain: 1 },
      { id: "hullFloat", x: 61, cx: 0, cy: 9, depth: 0.55, gain: 1 },
      { id: "plankFloat", x: 75, cx: 0, cy: 0, depth: 0.92, gain: 1 },
      { id: "bowFloat", x: 341, cx: 0, cy: 5, depth: 1, gain: 1 }
    ];
    floaters.forEach(function (item) {
      var actor = document.getElementById(item.id);
      item.wrapper = document.createElementNS(svgNS, "g");
      actor.parentNode.insertBefore(item.wrapper, actor);
      item.wrapper.appendChild(actor);
    });

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

    function waveHeight(x, wave) {
      var distance = (x - wave.center) / 55;
      return Math.exp(-distance * distance) * Math.cos(distance * 2.2) * wave.energy * 12;
    }

    function surfaceHeight(x, depth) {
      return waves.reduce(function (height, wave) { return height + waveHeight(x, wave) * depth; }, 0);
    }

    function drawWave(wave, age) {
      wave.center = wave.x + wave.direction * age * 150;
      wave.energy = wave.strength * Math.min(1, age / 0.18) * Math.pow(Math.max(0, 1 - age / lifetime), 1.2);
      wave.paths.forEach(function (path, index) {
        var row = rows[index];
        var points = [];
        for (var offset = -110; offset <= 110; offset += 10) {
          var x = wave.center + offset;
          var y = row.y + Math.sin(x / 28) * 2 - waveHeight(x, wave) * row.depth;
          points.push((offset === -110 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1));
        }
        path.setAttribute("d", points.join(" "));
        path.setAttribute("opacity", Math.min(0.9, wave.energy * 1.3).toFixed(3));
      });
    }

    function removeWave(wave) { wave.paths.forEach(function (path) { path.remove(); }); }

    function resetFloaters() {
      floaters.forEach(function (item) { item.wrapper.removeAttribute("transform"); });
    }

    function stopWaves() {
      window.cancelAnimationFrame(frameId);
      window.clearTimeout(stillTimer);
      frameId = 0;
      stillTimer = 0;
      waves.forEach(removeWave);
      waves = [];
      resetFloaters();
    }

    function frame(now) {
      frameId = 0;
      waves = waves.filter(function (wave) {
        var age = (now - wave.created) / 1000;
        if (age >= lifetime) { removeWave(wave); return false; }
        drawWave(wave, age);
        return true;
      });
      if (!waves.length) { resetFloaters(); return; }

      floaters.forEach(function (item) {
        var lift = clamp(surfaceHeight(item.x, item.depth), -11, 11) * item.gain;
        var slope = surfaceHeight(item.x + 12, item.depth) - surfaceHeight(item.x - 12, item.depth);
        var lean = clamp(-slope * 0.48, -5, 5) * item.gain;
        item.wrapper.setAttribute("transform", "translate(0 " + (-lift).toFixed(2) + ") rotate(" + lean.toFixed(2) + " " + item.cx + " " + item.cy + ")");
      });
      frameId = window.requestAnimationFrame(frame);
    }

    function raiseWave(x, direction, strength) {
      if (reducedMotion.matches) stopWaves();
      if (waves.length === 3) removeWave(waves.shift());
      var wave = { x: x, direction: direction, strength: strength, created: performance.now(), center: x, energy: 0 };
      wave.paths = rows.map(function (row) {
        var path = document.createElementNS(svgNS, "path");
        path.setAttribute("stroke-width", (1.2 + row.depth * 1.6).toFixed(1));
        row.layer.appendChild(path);
        return path;
      });
      waves.push(wave);
      if (reducedMotion.matches) {
        // A brief stationary crest acknowledges input without moving the scene.
        drawWave(wave, 0.3);
        stillTimer = window.setTimeout(stopWaves, 650);
      } else if (!frameId) {
        frameId = window.requestAnimationFrame(frame);
      }
    }

    function seaX(event) {
      var bounds = scene.getBoundingClientRect();
      return clamp((event.clientX - bounds.left) / bounds.width * 420, 0, 420);
    }

    function endGesture() {
      if (!gesture) return;
      var pointerId = gesture.id;
      if (gesture.dragging || gesture.cancelled) suppressClickUntil = performance.now() + 500;
      gesture = null;
      control.classList.remove("is-dragging");
      if (control.hasPointerCapture(pointerId)) control.releasePointerCapture(pointerId);
    }

    control.addEventListener("pointerdown", function (event) {
      if (!event.isPrimary || event.button !== 0 || gesture) return;
      gesture = { id: event.pointerId, startX: event.clientX, startY: event.clientY, waveX: seaX(event), emitted: -Infinity, dragging: false, cancelled: false };
      control.setPointerCapture(event.pointerId);
    });

    control.addEventListener("pointermove", function (event) {
      if (!gesture || event.pointerId !== gesture.id) return;
      var dx = event.clientX - gesture.startX;
      var dy = event.clientY - gesture.startY;
      if (!gesture.dragging) {
        // Leave vertical gestures to native scrolling; do not turn them into waves.
        if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) {
          gesture.cancelled = true;
          endGesture();
          return;
        }
        if (Math.abs(dx) < 8) return;
        gesture.dragging = true;
        control.classList.add("is-dragging");
      }
      var x = seaX(event);
      var distance = x - gesture.waveX;
      var now = performance.now();
      if (Math.abs(distance) < 12 || now - gesture.emitted < 140) return;
      raiseWave(gesture.waveX, distance > 0 ? 1 : -1, clamp(Math.abs(distance) / 85, 0.4, 0.9));
      gesture.waveX = x;
      gesture.emitted = now;
    });

    control.addEventListener("pointerup", function (event) {
      if (gesture && event.pointerId === gesture.id) endGesture();
    });
    control.addEventListener("pointercancel", function (event) {
      if (gesture && event.pointerId === gesture.id) { gesture.cancelled = true; endGesture(); }
    });
    control.addEventListener("lostpointercapture", function (event) {
      if (gesture && event.pointerId === gesture.id) { gesture.cancelled = true; endGesture(); }
    });
    control.addEventListener("click", function (event) {
      if (event.detail !== 0 && performance.now() < suppressClickUntil) return;
      var x = event.detail === 0 ? 50 : seaX(event);
      raiseWave(x, x < 210 ? 1 : -1, 0.65);
    });
    control.addEventListener("keydown", function (event) {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      var right = event.key === "ArrowRight";
      raiseWave(right ? 45 : 375, right ? 1 : -1, 0.75);
    });

    reducedMotion.addEventListener("change", stopWaves);
    window.addEventListener("blur", endGesture);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { endGesture(); stopWaves(); }
    });
    control.hidden = false;
    document.getElementById("waveHint").hidden = false;
  })();
  </script>
