<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ворон и летучая мышка</title>
  <style>
    :root {
      --bg-top: #17243a;
      --bg-mid: #324b43;
      --bg-bottom: #d9b985;
      --paper-strong: rgba(255, 250, 236, 0.97);
      --text: #281b18;
      --soft-text: rgba(40, 27, 24, 0.68);
      --accent: #8b3f5f;
      --accent-dark: #5e263d;
      --wing-speed: 0.56s;
      --heart-speed: 940ms;
      --scene-speed: 3.9s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 230, 174, 0.28), transparent 18%),
        radial-gradient(circle at 20% 86%, rgba(168, 91, 95, 0.18), transparent 24%),
        linear-gradient(160deg, #10182a 0%, #273d39 50%, #6d5646 100%);
    }

    .app {
      width: min(100%, 480px);
    }

    .story-card {
      position: relative;
      width: 100%;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 18px 28px;
      border: 1px solid rgba(255, 245, 221, 0.55);
      border-radius: 34px;
      background: linear-gradient(180deg, var(--paper-strong), rgba(245, 226, 190, 0.88));
      box-shadow: 0 24px 70px rgba(9, 16, 29, 0.38);
      overflow: hidden;
      text-align: center;
      animation: screenIn 360ms ease both;
    }

    .story-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 24% 18%, rgba(255, 236, 178, 0.35), transparent 18%),
        radial-gradient(circle at 82% 8%, rgba(255, 200, 189, 0.22), transparent 22%);
      pointer-events: none;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1,
    p,
    a,
    button {
      position: relative;
      z-index: 2;
    }

    h1 {
      max-width: 390px;
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      max-width: 370px;
      margin: 0;
      font-size: clamp(16px, 4.4vw, 19px);
      line-height: 1.38;
      color: var(--soft-text);
      font-weight: 650;
    }

    .top-nav {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      position: relative;
      z-index: 3;
    }

    .back-link,
    .replay-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      font: inherit;
      font-size: 15px;
      font-weight: 850;
      color: #39211d;
      background: rgba(255, 247, 223, 0.9);
      box-shadow: 0 8px 18px rgba(60, 29, 34, 0.12);
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: transform 150ms ease, box-shadow 150ms ease;
      touch-action: manipulation;
    }

    .back-link:active,
    .replay-button:active {
      transform: scale(0.97);
      box-shadow: 0 6px 12px rgba(60, 29, 34, 0.12);
    }

    .scene {
      position: relative;
      z-index: 1;
      width: min(100%, 410px);
      aspect-ratio: 1 / 1.05;
      border-radius: 30px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 54%, var(--bg-bottom) 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 16px 32px rgba(42, 23, 17, 0.22);
      isolation: isolate;
    }

    .scene svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .moon-glow {
      animation: moonPulse 4.8s ease-in-out infinite;
    }

    @keyframes moonPulse {
      0%, 100% { opacity: 0.58; transform: scale(1); }
      50% { opacity: 0.78; transform: scale(1.05); }
    }

    .mist {
      animation: mistDrift var(--scene-speed) ease-in-out infinite alternate;
    }

    @keyframes mistDrift {
      from { transform: translateX(-8px); opacity: 0.38; }
      to { transform: translateX(12px); opacity: 0.58; }
    }

    .raven,
    .bat {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: idleFloat 3.6s ease-in-out infinite;
    }

    .bat {
      animation-delay: -1.1s;
    }

    @keyframes idleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .raven-wing {
      transform-box: fill-box;
      transform-origin: 82% 58%;
      animation: ravenWingIdle 2.4s ease-in-out infinite;
    }

    .bat-wing-left,
    .bat-wing-right {
      transform-box: fill-box;
      animation: batWingIdle 2.1s ease-in-out infinite;
    }

    .bat-wing-left {
      transform-origin: 100% 52%;
    }

    .bat-wing-right {
      transform-origin: 0% 52%;
    }

    @keyframes ravenWingIdle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg); }
    }

    @keyframes batWingIdle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(7deg); }
    }

    .story-card.playing .raven,
    .story-card.playing .bat {
      animation: excitedFloat 1.1s ease-in-out infinite;
    }

    .story-card.playing .raven-wing {
      animation: ravenWingExcited var(--wing-speed) ease-in-out infinite;
    }

    .story-card.playing .bat-wing-left {
      animation: batLeftExcited var(--wing-speed) ease-in-out infinite;
    }

    .story-card.playing .bat-wing-right {
      animation: batRightExcited var(--wing-speed) ease-in-out infinite;
    }

    @keyframes excitedFloat {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    @keyframes ravenWingExcited {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(-26deg); }
    }

    @keyframes batLeftExcited {
      0%, 100% { transform: rotate(16deg); }
      50% { transform: rotate(-28deg); }
    }

    @keyframes batRightExcited {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(28deg); }
    }

    .story-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 3;
    }

    .replay-button {
      color: #fff7df;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      box-shadow: 0 14px 28px rgba(63, 26, 42, 0.22);
    }

    .heart {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      font-size: var(--size);
      animation: heartFlight var(--heart-speed) ease-out forwards;
      filter: drop-shadow(0 4px 7px rgba(55, 21, 36, 0.22));
    }

    @keyframes heartFlight {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.35) rotate(0deg);
      }
      12% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--scale)) rotate(var(--rotate));
      }
    }

    .sparkle {
      position: fixed;
      z-index: 49;
      pointer-events: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 240, 183, 0.95);
      animation: sparkleFlight 780ms ease-out forwards;
    }

    @keyframes sparkleFlight {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      20% { opacity: 1; }
      to { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.05); }
    }

    @media (max-height: 720px) {
      body {
        align-items: flex-start;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .story-card {
        min-height: calc(100svh - 20px);
        gap: 12px;
        padding-top: 18px;
        padding-bottom: 20px;
      }

      .scene {
        width: min(100%, 350px);
      }

      h1 {
        font-size: clamp(27px, 7.4vw, 36px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <article class="story-card" id="storyCard">
      <div class="top-nav">
        <a class="back-link" href="../../">← к сказкам</a>
      </div>

      <h1>Ворон и летучая мышка</h1>
      <p class="subtitle">На открытой поляне среди хвойного леса они снова ждут продолжения.</p>

      <section class="scene" id="storyScene" aria-label="Ворон и летучая мышка на лесной поляне">
        <svg viewBox="0 0 420 440" role="img" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="moonGradient" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff6c9" />
              <stop offset="60%" stop-color="#ffe8a3" />
              <stop offset="100%" stop-color="rgba(255,232,163,0)" />
            </radialGradient>
            <linearGradient id="grassGradient" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#8fa45b" />
              <stop offset="100%" stop-color="#5d6f3e" />
            </linearGradient>
            <linearGradient id="ravenGradient" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#2f3449" />
              <stop offset="100%" stop-color="#0d101c" />
            </linearGradient>
            <linearGradient id="batGradient" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#4b3b59" />
              <stop offset="100%" stop-color="#181424" />
            </linearGradient>
          </defs>

          <rect width="420" height="440" fill="#22324a" />
          <circle class="moon-glow" cx="210" cy="72" r="82" fill="url(#moonGradient)" />
          <circle cx="210" cy="72" r="30" fill="#ffeec0" />
          <circle cx="220" cy="62" r="30" fill="#22324a" opacity="0.22" />

          <g fill="#fff3c6" opacity="0.82">
            <circle cx="65" cy="57" r="2" />
            <circle cx="340" cy="48" r="2.2" />
            <circle cx="365" cy="112" r="1.6" />
            <circle cx="109" cy="112" r="1.8" />
            <circle cx="282" cy="104" r="1.4" />
          </g>

          <g opacity="0.72">
            <path d="M22 260l31-88 31 88Z" fill="#162a2c" />
            <path d="M56 262l42-118 42 118Z" fill="#123027" />
            <path d="M316 264l36-103 36 103Z" fill="#123027" />
            <path d="M354 260l29-86 29 86Z" fill="#172a2d" />
            <path d="M0 268l34-102 34 102Z" fill="#0f2327" />
            <path d="M130 266l36-101 36 101Z" fill="#142b28" />
            <path d="M237 267l38-107 38 107Z" fill="#132b2e" />
          </g>

          <g>
            <path d="M-18 315l42-135 42 135Z" fill="#0c241f" />
            <path d="M31 318l52-156 52 156Z" fill="#14352b" />
            <path d="M338 318l50-150 50 150Z" fill="#123027" />
            <path d="M286 319l40-128 40 128Z" fill="#0d261f" />
            <rect x="78" y="270" width="11" height="72" rx="4" fill="#513b2c" opacity="0.7" />
            <rect x="322" y="272" width="10" height="72" rx="4" fill="#4a3529" opacity="0.7" />
          </g>

          <g class="mist" fill="#f7e6cb" opacity="0.42">
            <ellipse cx="113" cy="297" rx="90" ry="17" />
            <ellipse cx="284" cy="304" rx="112" ry="19" />
          </g>

          <ellipse cx="210" cy="343" rx="206" ry="95" fill="url(#grassGradient)" />
          <ellipse cx="210" cy="346" rx="142" ry="54" fill="#b8b06f" opacity="0.36" />
          <path d="M46 374c49-26 89-34 137-23 42 10 78 6 119-11 25-10 51-10 77 0" fill="none" stroke="#e6ce8d" stroke-width="5" stroke-linecap="round" opacity="0.38" />

          <g id="raven" transform="translate(92 258) scale(0.82)">
            <g class="raven">
              <ellipse cx="0" cy="45" rx="33" ry="48" fill="url(#ravenGradient)" />
              <circle cx="9" cy="3" r="26" fill="#1d2233" />
              <path d="M32 0l45 12-43 17c5-10 5-19-2-29Z" fill="#12131b" />
              <path class="raven-wing" d="M-18 38c-46-8-75 22-93 58 39-12 78-4 111 16 18-27 16-54 18-74Z" fill="#111827" />
              <path d="M-16 44c-28 2-57 24-75 47 33-12 64-5 88 11 9-19 9-39-13-58Z" fill="#2b3145" opacity="0.55" />
              <circle cx="18" cy="-4" r="4.5" fill="#fff6c9" />
              <circle cx="19" cy="-4" r="2.2" fill="#15151d" />
              <path d="M-11 92c-9 13-17 24-24 33M5 94c0 16-1 29-3 41" stroke="#19151c" stroke-width="6" stroke-linecap="round" />
              <path d="M-35 125l-18 8M-35 125l-9 16M2 135l-16 11M2 135l9 16" stroke="#19151c" stroke-width="5" stroke-linecap="round" />
            </g>
          </g>

          <g id="bat" transform="translate(322 256) scale(0.9)">
            <g class="bat">
              <path class="bat-wing-left" d="M-13 31c-33-45-73-45-104-18 21 3 31 13 31 31 20-10 38-7 54 10 5-12 11-20 19-23Z" fill="url(#batGradient)" />
              <path class="bat-wing-right" d="M13 31c33-45 73-45 104-18-21 3-31 13-31 31-20-10-38-7-54 10-5-12-11-20-19-23Z" fill="url(#batGradient)" />
              <ellipse cx="0" cy="46" rx="24" ry="37" fill="#21192d" />
              <circle cx="0" cy="12" r="24" fill="#2e2540" />
              <path d="M-16 -4l-10-31 27 21Z" fill="#2e2540" />
              <path d="M16 -4l10-31-27 21Z" fill="#2e2540" />
              <path d="M-14 1l-6-17 15 11Z" fill="#69536d" opacity="0.6" />
              <path d="M14 1l6-17-15 11Z" fill="#69536d" opacity="0.6" />
              <circle cx="-8" cy="9" r="3.8" fill="#fff6c9" />
              <circle cx="8" cy="9" r="3.8" fill="#fff6c9" />
              <path d="M-7 23c5 5 10 5 15 0" fill="none" stroke="#f1d7c0" stroke-width="3" stroke-linecap="round" />
              <path d="M-9 83c-3 14-8 25-15 33M9 83c3 14 8 25 15 33" stroke="#1b1724" stroke-width="5" stroke-linecap="round" />
            </g>
          </g>
        </svg>
      </section>

      <div class="story-footer">
        <button class="replay-button" type="button" id="replayButton">оживить ещё раз</button>
      </div>
    </article>
  </main>

  <script>
    const storyCard = document.getElementById("storyCard");
    const storyScene = document.getElementById("storyScene");
    const replayButton = document.getElementById("replayButton");
    const animationTimers = [];

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function clearAnimationTimers() {
      animationTimers.forEach((timer) => window.clearTimeout(timer));
      animationTimers.length = 0;
    }

    function getCharacterOrigins() {
      const rect = storyScene.getBoundingClientRect();

      return [
        {
          x: rect.left + rect.width * 0.25,
          y: rect.top + rect.height * 0.64
        },
        {
          x: rect.left + rect.width * 0.77,
          y: rect.top + rect.height * 0.63
        }
      ];
    }

    function createHeart(origin) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.22 ? "❤️" : "💜";
      heart.style.left = `${origin.x + randomBetween(-10, 10)}px`;
      heart.style.top = `${origin.y + randomBetween(-8, 8)}px`;
      heart.style.setProperty("--x", `${randomBetween(-160, 160)}px`);
      heart.style.setProperty("--y", `${randomBetween(-230, -55)}px`);
      heart.style.setProperty("--scale", `${randomBetween(0.75, 1.55)}`);
      heart.style.setProperty("--rotate", `${randomBetween(-42, 42)}deg`);
      heart.style.setProperty("--size", `${randomBetween(18, 34)}px`);
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }

    function createSparkle(origin) {
      const sparkle = document.createElement("span");
      sparkle.className = "sparkle";
      sparkle.style.left = `${origin.x + randomBetween(-12, 12)}px`;
      sparkle.style.top = `${origin.y + randomBetween(-12, 12)}px`;
      sparkle.style.setProperty("--x", `${randomBetween(-115, 115)}px`);
      sparkle.style.setProperty("--y", `${randomBetween(-180, -30)}px`);
      document.body.appendChild(sparkle);
      sparkle.addEventListener("animationend", () => sparkle.remove());
    }

    function playStoryAnimation() {
      clearAnimationTimers();
      storyCard.classList.add("playing");

      const origins = getCharacterOrigins();
      const hearts = 46;
      const sparkles = 18;
      const delay = 22;

      for (let i = 0; i < hearts; i += 1) {
        const timer = window.setTimeout(() => {
          createHeart(origins[i % origins.length]);
        }, i * delay);
        animationTimers.push(timer);
      }

      for (let i = 0; i < sparkles; i += 1) {
        const timer = window.setTimeout(() => {
          createSparkle(origins[i % origins.length]);
        }, i * delay * 1.5);
        animationTimers.push(timer);
      }
    }

    replayButton.addEventListener("click", playStoryAnimation);
    window.addEventListener("load", () => {
      window.setTimeout(playStoryAnimation, 260);
    });
  </script>
</body>
</html>
