<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ворон и летучая мышка</title>
  <style>
    :root {
      --paper-strong: rgba(255, 250, 236, 0.97);
      --text: #281b18;
      --soft-text: rgba(40, 27, 24, 0.68);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 234, 190, 0.26), transparent 18%),
        radial-gradient(circle at 20% 86%, rgba(120, 96, 168, 0.2), transparent 24%),
        linear-gradient(160deg, #0d1224 0%, #241f42 50%, #6a5a52 100%);
    }

    .app { width: min(100%, 480px); }

    .story-card {
      position: relative;
      width: 100%;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 18px 28px;
      border: 1px solid rgba(255, 245, 221, 0.55);
      border-radius: 34px;
      background: linear-gradient(180deg, var(--paper-strong), rgba(238, 226, 214, 0.9));
      box-shadow: 0 24px 70px rgba(9, 12, 29, 0.4);
      overflow: hidden;
      text-align: center;
      animation: screenIn 360ms ease both;
    }

    .story-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 24% 18%, rgba(255, 236, 190, 0.32), transparent 18%),
        radial-gradient(circle at 82% 8%, rgba(206, 194, 236, 0.26), transparent 22%);
      pointer-events: none;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1, p, a { position: relative; z-index: 2; }

    h1 {
      max-width: 390px;
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      max-width: 372px;
      margin: 0;
      font-size: clamp(15px, 4.2vw, 18px);
      line-height: 1.38;
      color: var(--soft-text);
      font-weight: 650;
    }

    .top-nav {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      position: relative;
      z-index: 3;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      font: inherit;
      font-size: 15px;
      font-weight: 850;
      color: #2f2440;
      background: rgba(255, 247, 232, 0.92);
      box-shadow: 0 8px 18px rgba(30, 24, 52, 0.14);
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: transform 150ms ease, box-shadow 150ms ease;
      touch-action: manipulation;
    }

    .back-link:active {
      transform: scale(0.97);
      box-shadow: 0 6px 12px rgba(30, 24, 52, 0.14);
    }

    .scene {
      position: relative;
      z-index: 1;
      width: min(100%, 410px);
      aspect-ratio: 21 / 22;
      border-radius: 30px;
      overflow: hidden;
      background: #0b1020;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 16px 32px rgba(20, 16, 34, 0.28);
      isolation: isolate;
      cursor: ew-resize;
      touch-action: none;
    }

    .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse 82% 78% at 50% 44%, rgba(5, 8, 16, 0) 54%, rgba(5, 8, 16, 0.6) 100%);
    }

    .star { animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.95; }
    }

    .mist { animation: mistDrift 14s ease-in-out infinite alternate; }
    @keyframes mistDrift {
      from { transform: translateX(-14px); opacity: 0.22; }
      to { transform: translateX(16px); opacity: 0.44; }
    }

    .grass { transform-box: fill-box; transform-origin: center bottom; animation: sway 5.2s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-2.6deg); } to { transform: rotate(3deg); } }

    .rv-wing { transform-box: fill-box; transform-origin: 84% 26%; animation: wingIdle 4.4s ease-in-out infinite; }
    @keyframes wingIdle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-4.5deg); }
    }

    /* he keeps watching her — never the ground */
    #ravenHead { transform-box: fill-box; transform-origin: 26% 86%; animation: watchHer 11s ease-in-out infinite; }
    @keyframes watchHer {
      0%, 44%, 100% { transform: rotate(0deg); }
      54% { transform: rotate(-5deg); }
      68% { transform: rotate(-4deg); }
      80% { transform: rotate(2deg); }
    }

    .bt-wing-l, .bt-wing-r { transform-box: fill-box; }
    .bt-wing-l { transform-origin: 100% 8%; animation: cloakL 5.6s ease-in-out infinite; }
    .bt-wing-r { transform-origin: 0% 8%; animation: cloakR 5.6s ease-in-out infinite; }
    @keyframes cloakL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4.5deg); } }
    @keyframes cloakR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4.5deg); } }

    .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: blink 6.2s ease-in-out infinite; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(0); }
      93%, 96% { transform: scaleY(1); }
    }

    .heart {
      position: fixed;
      z-index: 60;
      pointer-events: none;
      font-size: var(--size);
      animation: heartFly 1300ms ease-out forwards;
      filter: drop-shadow(0 4px 8px rgba(30, 20, 50, 0.26));
    }
    @keyframes heartFly {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.25) rotate(0deg); }
      14% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--scale)) rotate(var(--rotate)); }
    }

    @media (max-height: 760px) {
      body { align-items: flex-start; padding-top: 10px; padding-bottom: 10px; }
      .story-card { min-height: calc(100svh - 20px); gap: 12px; padding-top: 18px; padding-bottom: 20px; }
      .scene { width: min(100%, 350px); }
      h1 { font-size: clamp(27px, 7.4vw, 36px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .star, .mist, .grass, .rv-wing, #ravenHead, .bt-wing-l, .bt-wing-r, .lid, .story-card {
        animation: none !important;
      }
      .lid { transform: scaleY(0) !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <article class="story-card" id="storyCard">
      <div class="top-nav">
        <a class="back-link" href="../../">← к сказкам</a>
      </div>

      <h1>Ворон и летучая мышка</h1>
      <p class="subtitle">История ворона и летучей мышки покрыта тайнами. Каждый хранил свой секрет, но любовь победила.</p>

      <section class="scene" id="scene" aria-label="Ворон и летучая мышка на лесной поляне под луной; на траве лежат две длинные тени">
        <svg viewBox="0 0 420 440" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="skyS" x1="0.2" x2="0.7" y1="0" y2="1">
              <stop offset="0%" stop-color="#080d1c" />
              <stop offset="38%" stop-color="#151f3c" />
              <stop offset="70%" stop-color="#26333f" />
              <stop offset="100%" stop-color="#4b4436" />
            </linearGradient>
            <radialGradient id="haloS" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255,247,212,0.92)" />
              <stop offset="32%" stop-color="rgba(255,233,168,0.4)" />
              <stop offset="100%" stop-color="rgba(255,233,168,0)" />
            </radialGradient>
            <!-- the clearing is kept bright: the shadows are the subject here -->
            <linearGradient id="groundS" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#8b9769" />
              <stop offset="44%" stop-color="#6f7c50" />
              <stop offset="100%" stop-color="#43502f" />
            </linearGradient>
            <linearGradient id="rvS" x1="0.1" x2="0.9" y1="0" y2="1">
              <stop offset="0%" stop-color="#333a52" />
              <stop offset="52%" stop-color="#181d2e" />
              <stop offset="100%" stop-color="#080a12" />
            </linearGradient>
            <linearGradient id="btS" x1="0.2" x2="0.8" y1="0" y2="1">
              <stop offset="0%" stop-color="#4e3e63" />
              <stop offset="54%" stop-color="#2a2140" />
              <stop offset="100%" stop-color="#151024" />
            </linearGradient>
            <!-- soft-edged, or the ellipse rim sweeps a visible seam across the shadows -->
            <radialGradient id="sheenG" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(242,230,168,0.92)" />
              <stop offset="45%" stop-color="rgba(242,230,168,0.62)" />
              <stop offset="78%" stop-color="rgba(242,230,168,0.2)" />
              <stop offset="100%" stop-color="rgba(242,230,168,0)" />
            </radialGradient>
            <radialGradient id="touchGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255,246,206,0.95)" />
              <stop offset="26%" stop-color="rgba(255,222,150,0.55)" />
              <stop offset="62%" stop-color="rgba(255,196,132,0.16)" />
              <stop offset="100%" stop-color="rgba(255,196,132,0)" />
            </radialGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="1.2" />
            </filter>

            <path id="firS" d="M0 -66 L-10 -37 L-5.5 -37 L-16 -11 L-9 -11 L-23 19 L23 19 L9 -11 L16 -11 L5.5 -37 L10 -37 Z" />

            <!-- the true forms, drawn upright with feet at y=0 -->
            <g id="manForm">
              <path d="M-13 0 C-15 -22 -14 -40 -9 -52 L 9 -52 C 14 -40 15 -22 13 0 C6 3 -6 3 -13 0 Z" />
              <path d="M-9 -52 C-6 -60 6 -60 9 -52 C4 -48 -4 -48 -9 -52 Z" />
              <circle cx="0" cy="-66" r="9.5" />
              <path d="M-10 -70 C-9 -78 -4 -82 1 -81 C7 -80 10 -75 10 -69 C7 -74 3 -76 -2 -75 C-6 -74 -9 -72 -10 -70 Z" />
              <path d="M-13 -2 C-16 6 -18 12 -16 16 L-8 16 C-9 10 -9 4 -8 -1 Z" />
              <path d="M13 -2 C16 6 18 12 16 16 L8 16 C9 10 9 4 8 -1 Z" />
            </g>
            <g id="ladyForm">
              <path d="M-19 0 C-17 -20 -13 -38 -8 -52 L 8 -52 C 13 -38 17 -20 19 0 C8 4 -8 4 -19 0 Z" />
              <path d="M-8 -52 C-5 -59 5 -59 8 -52 C4 -49 -4 -49 -8 -52 Z" />
              <circle cx="0" cy="-65" r="9" />
              <!-- long hair down to the shoulders; no dome on top, the crown sits there -->
              <path d="M-9 -63 C-13 -52 -14 -42 -12 -34 C-9 -42 -8 -52 -7 -58 Z" />
              <path d="M9 -63 C13 -52 14 -42 12 -34 C9 -42 8 -52 7 -58 Z" />
            </g>
            <!-- kept out of ladyForm so its opacity can be driven on its own.
                 the band overlaps the skull (head is a circle at 0,-65 r9, top at y=-74) so the
                 crown never floats, while the three points rise clear of it into empty sky —
                 anything drawn inside the silhouette would be invisible, same flat colour. -->
            <path id="crownForm" d="M-7.5 -70 L-7.5 -76 L-6 -76 L-4.5 -84 L-3 -76 L-1.5 -76 L0 -88 L1.5 -76 L3 -76 L4.5 -84 L6 -76 L7.5 -76 L7.5 -70 Z" />
            <g id="armForm">
              <path d="M0 -2 C10 -3 20 -3 28 -1 C31 0 31 6 28 7 C20 9 10 8 0 7 C-3 6 -3 -1 0 -2 Z" />
              <ellipse cx="30" cy="3" rx="4.6" ry="4.2" />
            </g>
          </defs>

          <rect width="420" height="440" fill="url(#skyS)" />

          <g fill="#fff3cd">
            <circle class="star" cx="34" cy="44" r="1.5" style="animation-delay: -0.4s" />
            <circle class="star" cx="86" cy="80" r="1.1" style="animation-delay: -1.6s" />
            <circle class="star" cx="140" cy="34" r="1.4" style="animation-delay: -2.7s" />
            <circle class="star" cx="196" cy="76" r="1.2" style="animation-delay: -0.9s" />
            <circle class="star" cx="248" cy="40" r="1.5" style="animation-delay: -2.2s" />
            <circle class="star" cx="308" cy="72" r="1.1" style="animation-delay: -1.3s" />
            <circle class="star" cx="366" cy="36" r="1.5" style="animation-delay: -3s" />
            <circle class="star" cx="400" cy="88" r="1.2" style="animation-delay: -0.6s" />
            <circle class="star" cx="60" cy="126" r="1" style="animation-delay: -2.5s" />
            <circle class="star" cx="352" cy="132" r="1.1" style="animation-delay: -1.9s" />
          </g>

          <!-- the moon can be dragged across the sky -->
          <g id="moonGroup">
            <circle id="moonHalo" cx="0" cy="0" r="86" fill="url(#haloS)" opacity="0.6" />
            <circle cx="0" cy="0" r="27" fill="#fff4cf" />
            <g fill="#e6d3a4" opacity="0.48">
              <circle cx="-8" cy="-7" r="5.4" />
              <circle cx="7" cy="7" r="3.6" />
              <circle cx="6" cy="-9" r="2.4" />
            </g>
          </g>

          <!-- forest -->
          <g fill="#111f2a" opacity="0.9" style="filter: blur(1.1px)">
            <use href="#firS" transform="translate(14 236) scale(0.6)" />
            <use href="#firS" transform="translate(58 232) scale(0.5)" />
            <use href="#firS" transform="translate(104 238) scale(0.64)" />
            <use href="#firS" transform="translate(150 234) scale(0.52)" />
            <use href="#firS" transform="translate(268 236) scale(0.56)" />
            <use href="#firS" transform="translate(314 232) scale(0.48)" />
            <use href="#firS" transform="translate(360 238) scale(0.62)" />
            <use href="#firS" transform="translate(406 234) scale(0.54)" />
          </g>
          <g fill="#0c2320">
            <use href="#firS" transform="translate(-4 276) scale(0.92)" />
            <use href="#firS" transform="translate(42 280) scale(0.78)" />
            <use href="#firS" transform="translate(92 274) scale(1)" />
            <use href="#firS" transform="translate(140 281) scale(0.74)" />
            <use href="#firS" transform="translate(286 280) scale(0.8)" />
            <use href="#firS" transform="translate(334 274) scale(0.98)" />
            <use href="#firS" transform="translate(382 281) scale(0.84)" />
            <use href="#firS" transform="translate(426 277) scale(0.9)" />
          </g>

          <g class="mist" fill="#eee0c6" opacity="0.34">
            <ellipse cx="110" cy="292" rx="124" ry="13" />
            <ellipse cx="318" cy="296" rx="112" ry="11" />
          </g>

          <!-- clearing -->
          <ellipse cx="210" cy="360" rx="230" ry="98" fill="url(#groundS)" />
          <ellipse id="groundSheen" cx="210" cy="352" rx="176" ry="62" fill="url(#sheenG)" opacity="0.24" />

          <!-- ============ the shadows ============ -->
          <g id="shadowLayer" filter="url(#softShadow)">
            <g id="shadowMan" opacity="0.5">
              <g transform="scale(1 -1)">
                <use href="#manForm" fill="#0a1a10" />
                <g id="manArm" transform="translate(9 -54)">
                  <use href="#armForm" fill="#0a1a10" />
                </g>
              </g>
            </g>
            <g id="shadowLady" opacity="0.5">
              <g transform="scale(1 -1)">
                <use href="#ladyForm" fill="#0a1a10" />
                <use id="ladyCrown" href="#crownForm" fill="#0a1a10" opacity="0" />
                <g id="ladyArm" transform="translate(-9 -54) scale(-1 1)">
                  <use href="#armForm" fill="#0a1a10" />
                </g>
              </g>
            </g>
          </g>

          <!-- light where the fingertips almost meet -->
          <circle id="touchLight" cx="212" cy="392" r="0" fill="url(#touchGlow)" opacity="0" />

          <!-- ============ the enchanted pair ============ -->
          <!-- stone under the raven -->
          <g>
            <path d="M133 322 C135 306 147 298 161 299 C175 300 185 309 184 322 Z" fill="#484736" />
            <path d="M139 314 C143 304 153 300 162 301 C171 302 178 307 179 314 Z" fill="#5a5943" />
            <g fill="#66803f" opacity="0.7">
              <ellipse cx="143" cy="316" rx="7" ry="3.2" />
              <ellipse cx="173" cy="311" rx="8" ry="3.4" />
            </g>
          </g>

          <g id="ravenRig" transform="translate(158 276) scale(0.76)">
            <g class="rv-tail">
              <path d="M-12 8 C-32 16 -50 30 -60 44 C-44 40 -28 32 -14 22 Z" fill="#0a0c14" />
              <path d="M-12 3 C-30 9 -46 21 -56 34 C-42 31 -26 24 -12 16 Z" fill="#141928" />
            </g>
            <ellipse cx="0" cy="4" rx="19" ry="24" fill="url(#rvS)" />
            <path d="M-12 -8 C-3 -18 10 -18 17 -8 C10 2 -5 4 -12 -3 Z" fill="#4c5678" opacity="0.35" />
            <g class="rv-wing">
              <path d="M-13 -2 C-5 -12 8 -12 15 -2 C11 14 -1 22 -12 20 C-18 12 -17 4 -13 -2 Z" fill="#141928" />
              <path d="M-10 12 C-19 20 -28 30 -34 42 C-24 36 -14 28 -7 20 Z" fill="#0c0f18" />
              <path d="M-8 10 C-16 17 -24 26 -30 36 C-21 31 -13 24 -6 17 Z" fill="#161c2c" opacity="0.9" />
            </g>
            <g id="ravenHead">
              <circle cx="8" cy="-21" r="12.5" fill="#191e30" />
              <path d="M0 -27 C6 -33 15 -33 20 -27 C15 -22 4 -22 0 -25 Z" fill="#4c5678" opacity="0.32" />
              <path d="M19 -25 C31 -24 41 -21 46 -18 C39 -15 28 -13 19 -14 Z" fill="#0b0d15" />
              <path d="M19 -19 C29 -19 37 -18 43 -17 C36 -15 27 -14 19 -14.4 Z" fill="#242b3f" opacity="0.75" />
              <circle cx="13" cy="-24" r="4.2" fill="#f6e4a6" />
              <circle cx="13.3" cy="-24" r="2.8" fill="#dcb55d" />
              <circle cx="13.5" cy="-24" r="1.5" fill="#12111a" />
              <circle cx="12.2" cy="-25.3" r="1" fill="#ffffff" opacity="0.85" />
              <circle class="lid" cx="13" cy="-24" r="4.4" fill="#191e30" />
            </g>
            <g stroke="#161320" stroke-width="4.4" stroke-linecap="round" fill="none">
              <path d="M-4 25 L-5 34" />
              <path d="M6 25 L7 34" />
              <path d="M-5 34 L-12 37 M-5 34 L-1 38 M7 34 L0 38 M7 34 L13 37" stroke-width="3" />
            </g>
          </g>

          <!-- branch the bat hangs from -->
          <g>
            <path d="M424 230 C392 232 358 242 332 252 C310 260 286 267 266 271" fill="none" stroke="#2c2118" stroke-width="8" stroke-linecap="round" />
            <path d="M352 246 C348 236 342 229 334 224" fill="none" stroke="#2c2118" stroke-width="4" stroke-linecap="round" />
            <g fill="#1c3320">
              <ellipse cx="400" cy="226" rx="17" ry="8" transform="rotate(-12 400 226)" />
              <ellipse cx="366" cy="236" rx="14" ry="7" transform="rotate(-16 366 236)" />
              <ellipse cx="336" cy="222" rx="12" ry="6" transform="rotate(22 336 222)" />
            </g>
          </g>

          <g id="batRig" transform="translate(264 278) scale(0.78)">
            <g stroke="#1f1830" stroke-width="3.4" stroke-linecap="round" fill="none">
              <path d="M-7 2 C-9 -3 -7 -7 -3 -8" />
              <path d="M7 2 C9 -3 7 -7 3 -8" />
            </g>
            <g class="bt-wing-l">
              <path d="M-5 6 C-24 12 -44 30 -52 56 C-44 52 -38 52 -34 56 C-38 64 -38 72 -34 80 C-28 72 -22 70 -16 74 C-16 62 -12 48 -6 38 Z" fill="url(#btS)" />
              <g stroke="#6d588a" stroke-width="1.2" fill="none" opacity="0.45">
                <path d="M-6 10 C-22 18 -36 34 -44 54" />
                <path d="M-6 18 C-20 28 -30 44 -34 58" />
                <path d="M-7 28 C-14 40 -18 54 -18 70" />
              </g>
            </g>
            <g class="bt-wing-r">
              <path d="M5 6 C24 12 44 30 52 56 C44 52 38 52 34 56 C38 64 38 72 34 80 C28 72 22 70 16 74 C16 62 12 48 6 38 Z" fill="url(#btS)" />
              <g stroke="#6d588a" stroke-width="1.2" fill="none" opacity="0.45">
                <path d="M6 10 C22 18 36 34 44 54" />
                <path d="M6 18 C20 28 30 44 34 58" />
                <path d="M7 28 C14 40 18 54 18 70" />
              </g>
            </g>
            <ellipse cx="0" cy="24" rx="13" ry="19" fill="#302545" />
            <path d="M-12 15 C-9 11 -5 13 -3 10 C-1 13 3 13 5 10 C7 13 10 11 12 15 C7 19 -7 19 -12 15 Z" fill="#6d588a" opacity="0.45" />
            <g id="batHead">
              <path d="M-9 -2 C-14 -12 -15 -21 -11 -27 C-6 -23 -2 -13 -3 -5 Z" fill="#3a2d51" />
              <path d="M9 -2 C14 -12 15 -21 11 -27 C6 -23 2 -13 3 -5 Z" fill="#3a2d51" />
              <path d="M-8 -4 C-11 -11 -12 -17 -10 -22 C-6 -18 -4 -12 -4 -6 Z" fill="#7a6086" opacity="0.5" />
              <path d="M8 -4 C11 -11 12 -17 10 -22 C6 -18 4 -12 4 -6 Z" fill="#7a6086" opacity="0.5" />

            </g>

          <!-- rim light that follows the moon -->
          <g id="rimLeft" opacity="0" fill="none" stroke="#ffeec2" stroke-width="2.2" stroke-linecap="round">
            <path d="M145 264 C138 274 136 286 139 296" />
            <path d="M250 266 C243 276 241 286 243 296" />

          <g id="rimRight" opacity="0" fill="none" stroke="#ffeec2" stroke-width="2.2" stroke-linecap="round">

          <!-- foreground grass -->
          <g stroke="#141f14" stroke-linecap="round" fill="none" opacity="0.94">

              <path d="M-6 448 C8 420 4 398 -6 380" stroke-width="6.4" />
              <path d="M22 452 C36 422 32 398 22 378" stroke-width="5.4" />

              <path d="M52 452 C64 426 60 404 50 386" stroke-width="5" />
              <path d="M80 456 C92 430 88 410 78 392" stroke-width="4.4" />
            </g>
            <g class="grass" style="animation-delay: -1.1s">
              <path d="M348 452 C362 424 358 402 348 384" stroke-width="5.4" />
              <path d="M380 448 C392 420 388 398 378 380" stroke-width="6.2" />
            </g>

  </main>

  <script>
  (function () {
    "use strict";

    var scene = document.getElementById("scene");

    var moonGroup = document.getElementById("moonGroup");
    var moonHalo = document.getElementById("moonHalo");
    var groundSheen = document.getElementById("groundSheen");
    var shadowMan = document.getElementById("shadowMan");
    var shadowLady = document.getElementById("shadowLady");
    var manArm = document.getElementById("manArm");
    var ladyArm = document.getElementById("ladyArm");
    var ladyCrown = document.getElementById("ladyCrown");
    var touchLight = document.getElementById("touchLight");
    var batHead = document.getElementById("batHead");
    var rimLeft = document.getElementById("rimLeft");
    var rimRight = document.getElementById("rimRight");

    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---- scene constants ---- */
    /* anchored just below their feet, so the far end of the shadow — and the clue
       on her head — still falls inside the moonlit part of the clearing */
    var ANCHOR_MAN = { x: 158, y: 308 };
    var ANCHOR_LADY = { x: 266, y: 308 };
    var SH_SCALE = 0.92;
    var MOON_CX = 210;
    var MOON_SPREAD = 168;

    /* moonX runs -1 (low left) .. 0 (high centre) .. 1 (low right) */
    var moonX = 0;
    var target = 0;
    var auto = true;
    var autoT = 0;
    var lastTouch = 0;

    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

    function apply(mx) {
      /* moon rides an arc: high in the middle, sinking towards both edges */
      var moonScreenX = MOON_CX + mx * MOON_SPREAD;
      var moonScreenY = 84 + mx * mx * 92;
      moonGroup.setAttribute("transform", "translate(" + moonScreenX.toFixed(1) + " " + moonScreenY.toFixed(1) + ")");

      var lowness = mx * mx;                       /* 0 = high, 1 = at the treeline */
      moonHalo.setAttribute("opacity", (0.44 + lowness * 0.4).toFixed(3));
      moonHalo.setAttribute("r", (86 + lowness * 26).toFixed(1));

      /* the shadows stretch as the moon sinks, but stay readable as people */
      var len = 1.0 + lowness * 0.28;
      var lean = -14 * mx;
      var reach = smooth((Math.abs(mx) - 0.24) / 0.62);

      var shadowTransform = " skewX(" + lean.toFixed(2) + ") scale(" +
        SH_SCALE.toFixed(3) + " " + (SH_SCALE * len).toFixed(3) + ")";
      shadowMan.setAttribute("transform", "translate(" + ANCHOR_MAN.x + " " + ANCHOR_MAN.y + ")" + shadowTransform);
      shadowLady.setAttribute("transform", "translate(" + ANCHOR_LADY.x + " " + ANCHOR_LADY.y + ")" + shadowTransform);

      /* shadows soften a little as they stretch; keep the swing small or the grass shows
         through at the extremes and they stop reading as shadows */
      var op = 0.82 - lowness * 0.05;
      shadowMan.setAttribute("opacity", op.toFixed(3));
      shadowLady.setAttribute("opacity", op.toFixed(3));

      /* the reaching arms stretch with the shadows, stopping just short of touching */
      var armAngle = 16 - reach * 24;
      var armScale = 1 + reach * 0.36;
      manArm.setAttribute(
        "transform",
        "translate(9 -54) rotate(" + armAngle.toFixed(2) + ") scale(" + armScale.toFixed(3) + " 1)"
      );
      ladyArm.setAttribute(
        "transform",
        "translate(-9 -54) scale(-1 1) rotate(" + armAngle.toFixed(2) + ") scale(" + armScale.toFixed(3) + " 1)"
      );

      /* the one clue: it fades in only as the shadows reach their longest, and goes to
         full strength so it reads as part of the shadow rather than a smudge on it */
      ladyCrown.setAttribute("opacity", smooth((reach - 0.45) / 0.55).toFixed(3));

      /* light where the fingertips almost meet */
      var meetY = ANCHOR_MAN.y + (54 + 3) * SH_SCALE * len;
      touchLight.setAttribute("cx", (212 + lean * 1.6).toFixed(1));
      touchLight.setAttribute("cy", meetY.toFixed(1));
      /* kept small so it accents the gap instead of washing the hands out */
      touchLight.setAttribute("r", (8 + reach * 24).toFixed(1));
      touchLight.setAttribute("opacity", (Math.pow(reach, 2.2) * 0.62).toFixed(3));

      /* she glances down at the ground; he never does */
      batHead.setAttribute(
        "transform",
        "translate(0 " + (reach * 2).toFixed(2) + ") rotate(" + (reach * 8).toFixed(2) + " 0 -6)"
      );

      /* rim light comes from whichever side the moon is on */
      rimLeft.setAttribute("opacity", (clamp(-mx, 0, 1) * 0.5).toFixed(3));
      rimRight.setAttribute("opacity", (clamp(mx, 0, 1) * 0.5).toFixed(3));

      groundSheen.setAttribute("cx", (210 + mx * 46).toFixed(1));
      /* raised to keep the centre as bright as the old flat fill now that it falls off */
      groundSheen.setAttribute("opacity", (0.15 + (1 - lowness) * 0.16).toFixed(3));
    }

    /* ---- hearts when the fingertips nearly meet ---- */
    var lastHeart = 0;

    function spawnHeart() {
      var r = scene.getBoundingClientRect();
      var heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.3 ? "❤️" : "🤍";
      heart.style.left = (r.left + r.width * (0.44 + Math.random() * 0.12)) + "px";
      heart.style.top = (r.top + r.height * (0.84 + Math.random() * 0.06)) + "px";
      heart.style.setProperty("--x", (Math.random() * 120 - 60).toFixed(0) + "px");
      heart.style.setProperty("--y", (-120 - Math.random() * 110).toFixed(0) + "px");
      heart.style.setProperty("--scale", (0.7 + Math.random() * 0.7).toFixed(2));
      heart.style.setProperty("--rotate", (Math.random() * 60 - 30).toFixed(0) + "deg");
      heart.style.setProperty("--size", (16 + Math.random() * 14).toFixed(0) + "px");
      document.body.appendChild(heart);
      heart.addEventListener("animationend", function () { heart.remove(); });
    }

    /* ---- dragging the picture moves the moon ---- */
    var dragging = false;

    function fromPointer(event) {
      var r = scene.getBoundingClientRect();
      return clamp((event.clientX - r.left) / r.width * 2 - 1, -1, 1);
    }

    scene.addEventListener("pointerdown", function (event) {
      dragging = true;
      auto = false;
      lastTouch = performance.now();
      target = fromPointer(event);
      if (scene.setPointerCapture) scene.setPointerCapture(event.pointerId);
    });

    scene.addEventListener("pointermove", function (event) {
      if (!dragging) return;
      target = fromPointer(event);
      lastTouch = performance.now();
    });

    function endDrag() {
      dragging = false;
      lastTouch = performance.now();
    }
    scene.addEventListener("pointerup", endDrag);
    scene.addEventListener("pointercancel", endDrag);

    /* ---- loop ---- */
    var prev = 0;

    function frame(now) {
      if (!prev) prev = now;
      var dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;

      /* hand back to the slow automatic sweep once the user lets go */
      if (!auto && !dragging && now - lastTouch > 4200) auto = true;

      if (auto) {
        autoT += dt;
        target = Math.sin(autoT * 0.24) * 0.94;
      }

      moonX += (target - moonX) * Math.min(1, dt * (dragging ? 9 : 2.4));
      apply(moonX);

      var reach = smooth((Math.abs(moonX) - 0.24) / 0.62);
      if (reach > 0.88 && now - lastHeart > 260) {
        lastHeart = now;
        spawnHeart();
      }

      window.requestAnimationFrame(frame);
    }

    if (reduced) {
      apply(0.9);
    } else {
      window.requestAnimationFrame(frame);
    }
  })();
  </script>
