<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Сказочная открытка о кролике с белой бабочкой, который продавал морковку на солнечной ярмарке." />
  <title>Как кролик продавал морковку</title>
  <style>
    :root {
      --paper-strong: rgba(255, 250, 236, 0.98);
      --text: #30241a;
      --soft-text: #76634f;
      --green: #315849;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(ellipse at 70% 12%, rgba(241, 184, 85, 0.24), transparent 45%),
        radial-gradient(ellipse at 12% 85%, rgba(138, 162, 97, 0.2), transparent 44%),
        linear-gradient(155deg, #172f30 0%, #3e5240 52%, #886145 100%);
    }

    .app { width: min(100%, 480px); }

    .story-card {
      position: relative;
      width: 100%;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 24px 18px 26px;
      border: 1px solid rgba(255, 245, 221, 0.65);
      border-radius: 34px;
      background: linear-gradient(180deg, var(--paper-strong), #efdfbe);
      box-shadow: 0 24px 70px rgba(18, 30, 26, 0.38);
      overflow: hidden;
      text-align: center;
      animation: screenIn 360ms ease both;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .top-nav { width: 100%; display: flex; justify-content: flex-start; }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 10px 15px;
      border-radius: 999px;
      color: var(--green);
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 18px rgba(78, 57, 32, 0.1);
      font-size: 15px;
      font-weight: 850;
      text-decoration: none;
      transition: transform 150ms ease, background 150ms ease;
    }

    .back-link:hover { background: #fffaf0; }
    .back-link:active, .buy-button:active { transform: scale(0.97); }
    .back-link:focus-visible, .buy-button:focus-visible { outline: 3px solid #ba652b; outline-offset: 4px; }

    h1 {
      max-width: 390px;
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      max-width: 100%;
      margin: 0;
      font-size: clamp(16px, 4.2vw, 18px);
      line-height: 1.4;
      color: var(--soft-text);
      font-weight: 650;
    }

    .scene {
      position: relative;
      width: min(100%, 410px);
      aspect-ratio: 21 / 22;
      flex-shrink: 0;
      border-radius: 30px;
      overflow: hidden;
      background: #bcd9c5;
      box-shadow: 0 16px 32px rgba(95, 65, 32, 0.2);
      isolation: isolate;
    }

    .scene svg { width: 100%; height: 100%; display: block; }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(91, 64, 27, 0.16) 100%);
    }

    .cloud { animation: cloudDrift 18s ease-in-out infinite alternate; }
    .cloud-far { animation-delay: -9s; }
    @keyframes cloudDrift { from { transform: translateX(-9px); } to { transform: translateX(13px); } }

    .pennant { transform-box: fill-box; transform-origin: center top; animation: flutter 3.2s ease-in-out infinite alternate; }
    .pennant:nth-child(2n) { animation-delay: -1.4s; }
    @keyframes flutter { from { transform: rotate(-5deg); } to { transform: rotate(7deg); } }

    /* Keep the necktie with the body; the head and ears move independently. */
    .rabbit-body { transform-box: view-box; transform-origin: 210px 321px; animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .rabbit-head { transform-box: view-box; transform-origin: 210px 261px; animation: headTilt 7.2s ease-in-out infinite; }
    @keyframes headTilt { 0%, 35%, 100% { transform: rotate(0deg); } 55%, 72% { transform: rotate(-4deg); } }
    .ear-left { transform-box: view-box; transform-origin: 189px 214px; animation: earLeft 5.8s ease-in-out infinite; }
    .ear-right { transform-box: view-box; transform-origin: 229px 214px; animation: earRight 6.4s ease-in-out infinite; }
    @keyframes earLeft { 0%, 65%, 100% { transform: rotate(0deg); } 72% { transform: rotate(-9deg); } 79% { transform: rotate(3deg); } 86% { transform: rotate(-4deg); } }
    @keyframes earRight { 0%, 36%, 62%, 100% { transform: rotate(0deg); } 44% { transform: rotate(8deg); } 52% { transform: rotate(-3deg); } }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s ease-in-out infinite; }
    @keyframes blink { 0%, 42%, 48%, 100% { transform: scaleY(1); } 44%, 46% { transform: scaleY(0.08); } }
    .rabbit-offer { transform-box: view-box; transform-origin: 238px 282px; animation: offerCarrot 4.8s ease-in-out infinite; }
    @keyframes offerCarrot { 0%, 100% { transform: rotate(4deg); } 45%, 60% { transform: rotate(-7deg); } }
    .bow-tie { transform-box: fill-box; transform-origin: center; animation: bowLift 3.6s ease-in-out infinite; }
    @keyframes bowLift { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .grass { transform-box: fill-box; transform-origin: center bottom; animation: grassSway 4s ease-in-out infinite alternate; }
    @keyframes grassSway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    .mote { animation: floatMote 7s ease-in-out infinite; }
    @keyframes floatMote { 0%, 100% { opacity: 0; transform: translateY(4px); } 40% { opacity: 0.7; } 80% { opacity: 0; transform: translate(9px, -24px); } }

    .flying-carrot, .payment { opacity: 0; pointer-events: none; }
    .selling .rabbit-offer { animation: handOver 1250ms ease-in-out both; }
    .selling .held-carrot { animation: releaseCarrot 1250ms linear both; }
    .selling .flying-carrot { animation: carrotToBuyer 1250ms ease-in both; }
    .selling .payment { animation: coinToCounter 1250ms ease-out both; }
    @keyframes handOver { 0%, 100% { transform: rotate(4deg); } 25%, 65% { transform: translate(5px, 4px) rotate(12deg); } }
    @keyframes releaseCarrot { 0%, 16%, 90%, 100% { opacity: 1; } 17%, 89% { opacity: 0; } }
    @keyframes carrotToBuyer {
      0%, 16% { opacity: 0; transform: translate(268px, 274px) rotate(-18deg) scale(0.8); }
      18% { opacity: 1; transform: translate(268px, 274px) rotate(-18deg) scale(0.8); }
      72% { opacity: 1; transform: translate(305px, 380px) rotate(12deg) scale(1.1); }
      92%, 100% { opacity: 0; transform: translate(318px, 454px) rotate(20deg) scale(1.2); }
    }
    @keyframes coinToCounter {
      0% { opacity: 0; transform: translate(308px, 414px) scale(0.8); }
      12% { opacity: 1; }
      48%, 70% { opacity: 1; transform: translate(279px, 307px) scale(1); }
      90%, 100% { opacity: 0; transform: translate(279px, 307px) scale(1); }
    }

    .shop-actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .buy-button {
      max-width: 100%;
      min-height: 48px;
      padding: 12px 26px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      color: #fffaf0;
      background: var(--green);
      box-shadow: 0 8px 18px rgba(38, 76, 57, 0.18);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }
    .buy-button:hover { background: #254638; }
    .buy-button:disabled { cursor: default; }
    .shop-note { min-height: 2.8em; max-width: 350px; margin: 0; color: var(--soft-text); font-size: 14px; font-weight: 650; line-height: 1.4; }
    [hidden] { display: none !important; }

    @media (max-height: 760px) {
      body { align-items: flex-start; padding-top: 10px; padding-bottom: 10px; }
      .story-card { min-height: calc(100svh - 20px); gap: 12px; padding-top: 18px; padding-bottom: 20px; }
      .scene { width: min(100%, 350px); }
      h1 { font-size: clamp(27px, 7.4vw, 36px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .story-card, .scene * { animation: none !important; }
      .back-link, .buy-button { transition: none; }
    }
  </style>
</head>

  <script>
  (function () {
    "use strict";

    var scene = document.getElementById("scene");
    var button = document.getElementById("buyButton");
    var note = document.getElementById("shopNote");
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var replies = [
      "Спасибо! Держи морковку. Заходи ещё!",
      "Вот ещё одна — только утром с грядки!",
      "Для хорошего покупателя — самая хрустящая!"
    ];
    var purchases = 0;

    document.getElementById("shopActions").hidden = false;

    button.addEventListener("click", function () {
      if (button.disabled) return;

      var reply = replies[purchases % replies.length];
      purchases += 1;

      if (reducedMotion.matches) {
        note.textContent = reply;
        return;
      }

      button.disabled = true;
      note.textContent = "Кролик выбирает для тебя морковку…";
      scene.classList.add("selling");

      window.setTimeout(function () {
        scene.classList.remove("selling");
        button.disabled = false;
        note.textContent = reply;
      }, 1250);
    });
  })();
  </script>
