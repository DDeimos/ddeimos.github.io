<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f1e7da" />
  <meta name="description" content="Хитренький, но романтичный опоссум зовёт тебя на свидание. Маленькая открытка с большим чувством." />
  <title>Тебе — от опоссума ♡</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f1e7da; --paper: #fffaf0; --ink: #443b35; --muted: #938277;
      --accent: #a7474e; --accent-hover: #8e3540; --line: #d9c8b5;
      --arch: #eddfc8; --arch-light: #f7edda; --ground: #dddcc1;
      --leaf: #86937a; --leaf-dark: #64765e; --flower: #be6972; --petal: #eee2cc;
    }
    * { box-sizing: border-box; }
    html { min-width: 280px; min-height: 100%; background: var(--page); }
    body {
      margin: 0; min-height: 100svh; padding: 36px 24px;
      display: grid; place-items: center; color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif; -webkit-tap-highlight-color: transparent;
      background: radial-gradient(ellipse at 14% 10%, #f9efe1 0, transparent 50%), radial-gradient(ellipse at 90% 100%, #e9d6c8 0, transparent 50%), var(--page);
    }
    body::before, .card::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23816d5c' opacity='.25' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
    }
    .card { position: relative; width: min(1080px, 100%); padding: 32px 44px 25px; border: 1px solid #fffdf7; border-radius: 7px; background: var(--paper); box-shadow: 0 26px 65px -30px #71594655, 0 3px 8px #7159460d; isolation: isolate; }
    .card::before { content: ""; position: absolute; z-index: -1; inset: 12px; border: 1px solid var(--line); border-radius: 2px; pointer-events: none; }
    .card::after { position: absolute; border-radius: inherit; opacity: .1; z-index: 4; }
    .card-header, .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .card-header { min-height: 48px; }
    .postal-label { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
    .postal-label svg { width: 25px; height: 25px; }
    .postmark { width: 101px; height: 66px; color: var(--accent); opacity: .75; transform: rotate(8deg); }
    .card-body { display: grid; grid-template-columns: 1.06fr 1fr; align-items: center; gap: 25px; padding: 7px 0 21px; }
    .illustration { position: relative; width: calc(100% + 24px); max-width: 480px; margin: 0 -10px 0 -14px; min-width: 0; }
    .scene { display: block; width: 100%; height: auto; overflow: visible; }
    .scene-arch { fill: var(--arch); }
    .scene-arch-light { fill: var(--arch-light); }
    .scene-ground { fill: var(--ground); }
    .plant-leaf { fill: var(--leaf); }
    .plant-dark { fill: var(--leaf-dark); }
    .plant-stem { fill: none; stroke: var(--leaf-dark); stroke-width: 2; stroke-linecap: round; }
    .flower-petal { fill: var(--flower); }
    .daisy-petal { fill: var(--petal); }
    .day-decoration { opacity: 1; }
    .copy { position: relative; padding: 0 12px 0 3px; }
    .eyebrow { margin: 0 0 22px; font: italic 21px Georgia, "Times New Roman", serif; color: var(--muted); }
    h1 { margin: 0; font: 400 clamp(32px, 4.2vw, 49px)/1.13 Georgia, "Times New Roman", serif; letter-spacing: -.045em; text-wrap: balance; }
    h1 em { color: var(--accent); font-weight: 400; }
    .title-line { display: block; }
    .actions { margin-top: 30px; }
    .yes-button {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 35px;
      min-width: 180px; min-height: 58px; padding: 16px 27px; border: 1px solid transparent; border-radius: 5px;
      background: var(--accent); color: #fff9ee; font: 500 17px/1.3 "Segoe UI", Arial, sans-serif;
      letter-spacing: .025em; cursor: pointer; box-shadow: 0 5px 0 #77313d16;
      transition: background .2s, transform .2s, box-shadow .2s; touch-action: manipulation;
    }
    .yes-button:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 7px 0 #77313d16; }
    .yes-button:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
    .yes-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .button-icon { width: 23px; height: 23px; }
    .button-check, .accepted .button-arrow { display: none; }
    .accepted .button-check { display: block; }
    .yes-button:disabled { cursor: default; }
    .status { min-height: 22px; margin: 15px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
    .accepted .status { color: var(--accent); }
    .card-footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); }
    .edition { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; }
    .signature { font: italic 14px Georgia, "Times New Roman", serif; }
    .footer-heart { display: inline-block; margin-left: 4px; color: var(--accent); }
    .opossum-character { transform-origin: 276px 448px; animation: breathing 4s ease-in-out infinite; }
    .head-tilt { transform-origin: 275px 312px; transition: transform .3s ease; }
    .tissue-arm { transform-origin: 335px 353px; transform: rotate(14deg); transition: transform .4s ease; }
    .open-eyes { animation: blink 6.4s infinite; transform-origin: 271px 240px; }
    .closed-eyes, .happy-mouth, .sneeze-mouth, .happy-arms, .happy-rays, .static-hearts { opacity: 0; }
    .shy-arms, .tissue-arm, .small-mouth, .happy-arms, .happy-rays, .static-hearts { transition: opacity .2s ease; }
    .tail-tip { transform-origin: 352px 414px; animation: tail-wag 5s ease-in-out infinite; }
    .sneeze-bubble { opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .2s; }
    .sneeze-word { fill: var(--accent); font: italic 23px Georgia, "Times New Roman", serif; }
    .ambient-heart { transform-origin: center; transform-box: fill-box; animation: heart-float 5s ease-in-out infinite; }
    .ambient-heart.second { animation-delay: -2.7s; }
    .grass-sway { transform-origin: 114px 439px; animation: grass-sway 6s ease-in-out infinite; }
    .is-inhaling .head-tilt { transform: translateY(-5px) rotate(-5deg); }
    .is-inhaling .tissue-arm { transform: rotate(-10deg); }
    .is-inhaling .open-eyes, .is-sneezing .open-eyes, .is-wiping .open-eyes { opacity: 0; animation: none; }
    .is-inhaling .closed-eyes, .is-sneezing .closed-eyes, .is-wiping .closed-eyes { opacity: 1; }
    .is-inhaling .small-mouth { opacity: 0; }
    .is-inhaling .sneeze-mouth { opacity: 1; }
    .is-sneezing .opossum-character { animation: sneeze .44s ease-in-out; }
    .is-sneezing .head-tilt { transform: translateY(4px) rotate(7deg); }
    .is-sneezing .tissue-arm { transform: rotate(-20deg); }
    .is-sneezing .sneeze-bubble { opacity: 1; transform: translateY(0) rotate(-8deg); }
    .is-wiping .tissue-arm { animation: wipe 1.5s ease-in-out both; }
    .is-wiping .head-tilt { transform: rotate(3deg); }
    .accepted .opossum-character { animation: happy-hop .75s cubic-bezier(.4,0,.4,1) 3, breathing 4s 2.25s ease-in-out infinite; }
    .accepted .head-tilt { transform: rotate(-5deg); }
    .accepted .shy-arms, .accepted .tissue-arm, .accepted .open-eyes, .accepted .small-mouth { opacity: 0; animation: none; }
    .accepted .happy-arms, .accepted .closed-eyes, .accepted .happy-mouth, .accepted .happy-rays, .accepted .static-hearts { opacity: 1; }
    .accepted .happy-arms { transform-origin: 274px 349px; animation: happy-paws 1s ease-in-out 3; }
    .accepted .tail-tip { animation: tail-wag 1.4s ease-in-out 4; }
    .heart-field { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 3; }
    .flying-heart { position: absolute; left: 49%; top: 55%; color: var(--heart-color); font: var(--size) Georgia, serif; line-height: 1; opacity: 0; animation: fly-heart 2.4s var(--delay) cubic-bezier(.12,.55,.45,1) forwards; }
    @keyframes breathing { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.06); } }
    @keyframes tail-wag { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes heart-float { 0%,100% { transform: translateY(0) rotate(-9deg); } 50% { transform: translateY(-7px) rotate(5deg); } }
    @keyframes grass-sway { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(2deg); } }
    @keyframes sneeze { 0%,100% { transform: translate(0); } 32% { transform: translate(3px,-6px) rotate(-2deg); } 58% { transform: translate(-3px,6px) rotate(3deg); } 78% { transform: translate(1px,1px); } }
    @keyframes wipe { 0%,100% { transform: rotate(14deg); } 23%,63% { transform: rotate(-24deg); } 43%,80% { transform: rotate(-8deg); } }
    @keyframes happy-hop { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-15px) rotate(2deg); } }
    @keyframes happy-paws { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.05); } }
    @keyframes fly-heart { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); } 15% { opacity: .9; } 75% { opacity: .8; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--spin)); } }
    @media (min-width: 761px) and (max-height: 760px) {
      body { padding-top: 20px; padding-bottom: 20px; }
      .card { padding-top: 24px; padding-bottom: 22px; }
      .card-body { padding-top: 7px; padding-bottom: 18px; }
      .illustration { max-width: 460px; }
      .postmark { width: 88px; height: 56px; }
    }
    @media (min-width: 1200px) { .card { transform: rotate(-.6deg); } }
    @media (max-width: 760px) {
      body { padding: 20px 16px; }
      .card { max-width: 480px; padding: 23px 28px 24px; }
      .card-header { min-height: 35px; }
      .postal-label { font-size: 8px; letter-spacing: .18em; gap: 7px; }
      .postal-label svg { width: 21px; height: 21px; }
      .postmark { width: 76px; height: 49px; }
      .card-body { grid-template-columns: 1fr; gap: 0; padding: 0 0 22px; }
      .illustration { width: min(100% + 12px,340px); margin: -11px auto -10px; }
      .copy { text-align: center; padding: 0 2px; }
      .eyebrow { margin-bottom: 12px; font-size: 17px; }
      h1 { font-size: clamp(30px,7.8vw,38px); line-height: 1.1; }
      .actions { margin-top: 22px; }
      .yes-button { min-height: 54px; min-width: 174px; padding: 14px 26px; }
      .status { margin-top: 12px; font-size: 11px; }
      .card-footer { padding-top: 16px; }
      .edition { font-size: 8px; letter-spacing: .12em; }
      .signature { font-size: 12px; }
    }
    @media (max-width: 360px) {
      body { padding: 12px 10px; }
      .card { padding-left: 23px; padding-right: 23px; }
      .illustration { width: 100%; }
      .signature { font-size: 11px; }
      .postal-label { letter-spacing: .1em; }
      .card-footer { gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation: none !important; transition: none !important; }
      .card { transform: none; }
      .flying-heart { display: none; }
    }
    .is-paused *,.is-paused *::before,.is-paused *::after { animation-play-state: paused !important; }
  </style>
</head>

            </g>
            <g stroke="#813b44" stroke-width="1.5"><path d="M266 330c-10-9-21-10-24-4-3 6-1 15 3 17 5 2 14-3 22-7m11-6c10-9 21-10 24-4 3 6 1 15-3 17-5 2-14-3-22-7" fill="#ad5960"/><path d="m250 330 13 3-13 4m45-7-13 3 13 4" fill="none"/><ellipse cx="272" cy="333" rx="7" ry="6" fill="#bc7172"/></g>
            <g class="shy-arms"><path d="M207 345c-20-1-40 23-33 38 6 14 32 10 52-3l-3-19" fill="url(#fur)" stroke="#696e64" stroke-width="2"/><path d="M214 362c5-6 16-6 20-2 5 5 3 15-3 20-7 6-19 5-21-2-2-6-1-11 4-16Z" fill="#d7a49b" stroke="#ad817a" stroke-width="1.5"/><path d="m221 365 1 8m5-9 1 7" stroke="#ac7c76" stroke-width="1.3"/></g>

              <path d="M334 357c18 5 31-17 24-32-4-11-15-13-23-8-11 7-6 17-11 24" fill="url(#fur)" stroke="#696e64" stroke-width="2"/>

          <g class="sneeze-bubble" aria-hidden="true"><text class="sneeze-word" x="111" y="223">апчхи!</text><path d="m174 233 12 7m-18 0 9 5" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/></g>
          <g class="happy-rays" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><path d="m127 230-11-6m20-11-5-11m271 33 12-5m-23-14 6-11"/></g>
          <g class="static-hearts" fill="var(--flower)"><path class="ambient-heart" d="M160 187c-4-5-18-14-18-23 0-10 14-12 18-3 5-9 18-7 18 3 0 9-13 18-18 23Z"/><path class="ambient-heart second" d="M382 199c-4-3-14-10-14-17 0-7 10-8 14-2 3-6 13-5 13 2 0 7-10 14-13 17Z"/></g>

            <g transform="translate(435 362)"><ellipse class="daisy-petal" cy="-10" rx="4" ry="10"/><ellipse class="daisy-petal" cy="-10" rx="4" ry="10" transform="rotate(60)"/><ellipse class="daisy-petal" cy="-10" rx="4" ry="10" transform="rotate(120)"/><ellipse class="daisy-petal" cy="-10" rx="4" ry="10" transform="rotate(180)"/><ellipse class="daisy-petal" cy="-10" rx="4" ry="10" transform="rotate(240)"/><ellipse class="daisy-petal" cy="-10" rx="4" ry="10" transform="rotate(300)"/><circle r="5" fill="#c7a25f"/></g>

            <ellipse cx="138" cy="457" rx="5" ry="2.5" fill="var(--flower)" transform="rotate(-15 138 457)"/><ellipse cx="395" cy="461" rx="5" ry="2.5" fill="var(--flower)" transform="rotate(20 395 461)"/>

      </figure>
      <section class="copy" aria-labelledby="invitation">
        <p class="eyebrow" aria-hidden="true">Вам открытка.</p>
        <h1 id="invitation"><span class="title-line">Хитренький, но романтичный</span> <span class="title-line"><em>опоссум</em> зовёт тебя</span> <span class="title-line">на свидание</span></h1>
        <div class="actions">
          <button class="yes-button" id="yesButton" type="button">
            <span>Иду</span>
            <svg class="button-icon button-arrow" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M4 13h17m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="button-icon button-check" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="m6 13 5 5L21 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true">Ждёт с нетерпением</p>
        </div>
      </section>
    </div>
    <footer class="card-footer" aria-hidden="true">
      <span class="edition">01 / Для тебя</span>
      <span class="signature">Не болей, твой опоссум <span class="footer-heart">♡</span></span>
    </footer>
  </main>
  <script>
    (() => {
      const card = document.getElementById("card");
      const button = document.getElementById("yesButton");
      const status = document.getElementById("status");
      const heartField = document.getElementById("heartField");
      const pictureTitle = document.getElementById("opossum-title");
      const pictureDescription = document.getElementById("opossum-description");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const timers = new Set();
      const sneezeClasses = ["is-inhaling", "is-sneezing", "is-wiping"];
      let accepted = false;

      function later(callback, delay) {
        const timer = window.setTimeout(() => {
          timers.delete(timer);
          callback();
        }, delay);
        timers.add(timer);
      }
      function clearTimers() {
        timers.forEach((timer) => window.clearTimeout(timer));
        timers.clear();
      }
      function setSneezeStage(stage) {
        card.classList.remove(...sneezeClasses);
        if (stage) card.classList.add(stage);
      }
      function scheduleSneeze(delay = 5200 + Math.random() * 3200) {
        if (accepted || reducedMotion.matches || document.hidden) return;
        later(() => {
          if (accepted || reducedMotion.matches || document.hidden) return;
          setSneezeStage("is-inhaling");
          later(() => {
            setSneezeStage("is-sneezing");
            later(() => {
              setSneezeStage("is-wiping");
              later(() => {
                setSneezeStage("");
                scheduleSneeze();
              }, 1500);
            }, 440);
          }, 950);
        }, delay);
      }
      function burstHearts(count) {
        if (reducedMotion.matches || document.hidden) return;
        const width = heartField.clientWidth;
        const height = heartField.clientHeight;
        const colors = ["#b45e68", "#cf9091", "#c7a274"];
        for (let index = 0; index < count; index += 1) {
          const heart = document.createElement("span");
          const direction = count > 6 ? index / (count - 1) : Math.random();
          heart.className = "flying-heart";
          heart.textContent = "♥";
          heart.style.setProperty("--dx", `${(direction - .5) * width * .86}px`);
          heart.style.setProperty("--dy", `${-(.2 + Math.random() * .4) * height}px`);
          heart.style.setProperty("--spin", `${-35 + Math.random() * 70}deg`);
          heart.style.setProperty("--size", `${12 + Math.random() * 16}px`);
          heart.style.setProperty("--delay", `${Math.random() * .45}s`);
          heart.style.setProperty("--heart-color", colors[index % colors.length]);
          heart.addEventListener("animationend", () => heart.remove(), { once: true });
          heartField.appendChild(heart);
        }
      }
      function scheduleHearts() {
        if (!accepted || reducedMotion.matches || document.hidden) return;
        later(() => {
          burstHearts(4);
          scheduleHearts();
        }, 2600);
      }
      function acceptDate() {
        if (accepted) return;
        accepted = true;
        clearTimers();
        setSneezeStage("");
        card.classList.add("accepted");
        button.disabled = true;
        status.textContent = "Ура! Тогда идём завтра ♡";
        pictureTitle.textContent = "Счастливый опоссум поднимает лапки";
        pictureDescription.textContent = "Опоссум убрал салфетку, перестал чихать и радостно поднял обе лапки. Вокруг него разлетаются сердечки.";
        burstHearts(26);
        scheduleHearts();
      }
      function resumeAnimation() {
        clearTimers();
        setSneezeStage("");
        heartField.replaceChildren();
        card.classList.toggle("is-paused", document.hidden);
        if (document.hidden || reducedMotion.matches) return;
        if (accepted) scheduleHearts();
        else scheduleSneeze(3200);
      }
      button.addEventListener("click", acceptDate, { once: true });
      document.addEventListener("visibilitychange", resumeAnimation);
      reducedMotion.addEventListener("change", resumeAnimation);
      window.addEventListener("pagehide", clearTimers);
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) resumeAnimation();
      });
      scheduleSneeze(3200);
    })();
  </script>
