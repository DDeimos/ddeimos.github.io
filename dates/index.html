<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приглашение</title>
  <style>
    :root {
      --bg-start: #dcefff;
      --bg-end: #f4faff;
      --card-bg: rgba(255, 255, 255, 0.82);
      --text: #213d55;
      --accent: #2784bf;
      --accent-dark: #1b6395;
      --secondary: #a8d4f0;
      --shadow: 0 20px 60px rgba(51, 116, 166, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(104, 181, 237, 0.22), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(164, 214, 250, 0.28), transparent 26%),
        linear-gradient(145deg, var(--bg-start), var(--bg-end));
    }

    .card {
      width: min(100%, 430px);
      min-height: 620px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 22px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 32px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      text-align: center;
      overflow: hidden;
    }

    .dog-wrap {
      width: min(82vw, 300px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(160deg, #fff, #e2f2ff);
      box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.55), 0 16px 36px rgba(39, 132, 191, 0.18);
    }

    .dog {
      width: 86%;
      height: auto;
      filter: drop-shadow(0 12px 16px rgba(56, 94, 124, 0.18));
      transform-origin: center bottom;
      animation: floatDog 3.4s ease-in-out infinite;
    }

    @keyframes floatDog {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    .held-heart {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseHeart 2.2s ease-in-out infinite;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    @media (prefers-reduced-motion: reduce) {
      .held-heart {
        animation: none;
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 9vw, 44px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      min-height: 58px;
      margin: 0;
      font-size: clamp(19px, 5.2vw, 24px);
      line-height: 1.32;
      font-weight: 650;
    }

    .actions {
      width: 100%;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 5;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 28px;
      font: inherit;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, opacity 160ms ease;
      touch-action: none;
    }

    button:active {
      transform: scale(0.96);
    }

    .yes {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      box-shadow: 0 12px 22px rgba(39, 132, 191, 0.3);
    }

    .yes:active {
      box-shadow: 0 8px 16px rgba(39, 132, 191, 0.24);
    }

    .no {
      color: #2c5879;
      background: #fff;
      box-shadow: 0 10px 22px rgba(40, 80, 112, 0.12);
      will-change: left, top, transform;
    }

    .no.is-running {
      position: fixed;
      z-index: 20;
      transition: left 190ms ease-out, top 190ms ease-out, transform 190ms ease-out;
    }

    .final-message {
      display: none;
      margin: 0;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 850;
      line-height: 1.2;
      color: #1b6395;
      animation: popIn 420ms cubic-bezier(.2, 1.4, .32, 1) both;
    }

    .card.accepted .subtitle,
    .card.accepted .actions {
      display: none;
    }

    .card.accepted .final-message {
      display: block;
    }

    .card.accepted .dog {
      animation: happyDog 720ms ease-in-out infinite alternate;
    }

    @keyframes happyDog {
      from { transform: translateY(0) rotate(-3deg) scale(1); }
      to { transform: translateY(-10px) rotate(3deg) scale(1.035); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .heart {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      pointer-events: none;
      font-size: 24px;
      animation: flyHeart 1100ms ease-out forwards;
    }

    @keyframes flyHeart {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--s)) rotate(var(--r));
      }
    }

    .tiny-note {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      color: rgba(33, 61, 85, 0.6);
    }

    @media (max-height: 690px) {
      body {
        align-items: flex-start;
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .card {
        min-height: calc(100svh - 28px);
        gap: 16px;
        padding-top: 22px;
        padding-bottom: 40px;
      }

      .dog-wrap {
        width: min(68vw, 245px);
      }
    }
  </style>
</head>
<body>
  <main class="card" id="card" aria-live="polite">
    <div class="dog-wrap" aria-hidden="true">
      <svg class="dog" viewBox="0 0 420 420" role="img" aria-label="Собачка с сердечком" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#ff6fa3" />
            <stop offset="100%" stop-color="#ff2f75" />
          </linearGradient>
          <linearGradient id="dogGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#fff5e5" />
            <stop offset="100%" stop-color="#e8bb86" />
          </linearGradient>
          <linearGradient id="earGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#c58b58" />
            <stop offset="100%" stop-color="#a86d42" />
          </linearGradient>
        </defs>

        <!-- tail -->
        <path d="M291 298c45 4 66-28 56-53-6-16-18-25-30-22" fill="none" stroke="#c58b58" stroke-width="24" stroke-linecap="round" />

        <!-- body and feet -->
        <ellipse cx="210" cy="284" rx="91" ry="101" fill="url(#dogGradient)" />
        <ellipse cx="210" cy="296" rx="58" ry="70" fill="#fff8ed" />
        <ellipse cx="155" cy="369" rx="39" ry="23" fill="#e8bb86" />
        <ellipse cx="265" cy="369" rx="39" ry="23" fill="#e8bb86" />
        <path d="M146 371v8M158 373v8M262 373v8M274 371v8" stroke="#c58b58" stroke-width="4" stroke-linecap="round" />

        <!-- floppy ears -->
        <path d="M151 91c-25-23-57-8-67 22-9 27-8 59 3 80 7 14 21 19 34 9 18-15 23-61 38-88Z" fill="url(#earGradient)" />
        <path d="M269 91c25-23 57-8 67 22 9 27 8 59-3 80-7 14-21 19-34 9-18-15-23-61-38-88Z" fill="url(#earGradient)" />

        <!-- head and eye patch -->
        <ellipse cx="210" cy="155" rx="82" ry="82" fill="url(#dogGradient)" />
        <ellipse cx="173" cy="142" rx="29" ry="35" fill="#dba875" transform="rotate(-18 173 142)" />

        <!-- face -->
        <ellipse cx="175" cy="149" rx="9" ry="12" fill="#352b28" />
        <ellipse cx="245" cy="149" rx="9" ry="12" fill="#352b28" />
        <circle cx="178" cy="145" r="3" fill="#fff" />
        <circle cx="248" cy="145" r="3" fill="#fff" />
        <ellipse cx="189" cy="183" rx="28" ry="23" fill="#fff8ed" />
        <ellipse cx="231" cy="183" rx="28" ry="23" fill="#fff8ed" />
        <path d="M210 185c-9 0-17-8-17-14 0-10 34-10 34 0 0 6-8 14-17 14Z" fill="#352b28" />
        <ellipse cx="205" cy="169" rx="5" ry="2.5" fill="#fff" opacity="0.4" />
        <path d="M210 199c-7 0-11 2-11 7v8c0 13 22 13 22 0v-8c0-5-4-7-11-7Z" fill="#ee8c9b" />
        <path d="M210 185v9m0 0c-6 10-18 12-26 5m26-5c6 10 18 12 26 5" fill="none" stroke="#352b28" stroke-width="4" stroke-linecap="round" />
        <path d="M210 211v8" stroke="#ce647b" stroke-width="3" stroke-linecap="round" />

        <!-- valentine heart -->
        <g class="held-heart">
          <path d="M210 340c-19-17-77-54-77-88 0-22 17-38 38-38 17 0 30 9 39 23 9-14 22-23 39-23 21 0 38 16 38 38 0 34-58 71-77 88Z" fill="url(#heartGradient)" stroke="#ffffff" stroke-width="8" />
          <text x="210" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#fff">♥</text>
        </g>

        <!-- paws holding the heart -->
        <ellipse cx="139" cy="275" rx="23" ry="29" fill="url(#dogGradient)" transform="rotate(-22 139 275)" />
        <ellipse cx="281" cy="275" rx="23" ry="29" fill="url(#dogGradient)" transform="rotate(22 281 275)" />
        <path d="m133 263 6 9m-15 1 7 9m156-19-6 9m15 1-7 9" stroke="#c58b58" stroke-width="3.5" stroke-linecap="round" />
      </svg>
    </div>

    <h1>Вам приглашение</h1>
    <p class="subtitle" id="question">пойдём на свидание?</p>

    <div class="actions" id="actions">
      <button class="yes" id="yesButton" type="button">да</button>
      <button class="no" id="noButton" type="button">нет</button>
    </div>

    <p class="final-message" id="finalMessage">Тогда давай же быстрее собираться</p>
    <p class="tiny-note">подсказка: правильный ответ только один ❤️</p>
  </main>

  <script>
    const card = document.getElementById("card");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");

    let noButtonEscapes = 0;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function rectsOverlap(a, b, padding = 14) {
      return !(
        a.right + padding < b.left ||
        a.left - padding > b.right ||
        a.bottom + padding < b.top ||
        a.top - padding > b.bottom
      );
    }

    function moveNoButton(event) {
      event.preventDefault();
      event.stopPropagation();

      noButtonEscapes += 1;
      noButton.classList.add("is-running");

      const margin = 18;
      const buttonRect = noButton.getBoundingClientRect();
      const yesRect = yesButton.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      const maxLeft = viewportWidth - buttonRect.width - margin;
      const maxTop = viewportHeight - buttonRect.height - margin;

      const tapX = event.clientX || viewportWidth / 2;
      const tapY = event.clientY || viewportHeight / 2;
      const minDistance = Math.min(170, Math.max(95, viewportWidth * 0.28));

      let bestPosition = {
        left: clamp(viewportWidth - buttonRect.width - margin, margin, maxLeft),
        top: clamp(viewportHeight * 0.62, margin, maxTop)
      };

      for (let i = 0; i < 40; i += 1) {
        const left = margin + Math.random() * Math.max(1, maxLeft - margin);
        const top = margin + Math.random() * Math.max(1, maxTop - margin);
        const centerX = left + buttonRect.width / 2;
        const centerY = top + buttonRect.height / 2;
        const distanceFromTap = Math.hypot(centerX - tapX, centerY - tapY);

        const candidateRect = {
          left,
          top,
          right: left + buttonRect.width,
          bottom: top + buttonRect.height
        };

        if (distanceFromTap > minDistance && !rectsOverlap(candidateRect, yesRect, 18)) {
          bestPosition = { left, top };
          break;
        }
      }

      noButton.style.left = `${bestPosition.left}px`;
      noButton.style.top = `${bestPosition.top}px`;
      noButton.style.transform = `rotate(${noButtonEscapes % 2 === 0 ? "5deg" : "-5deg"})`;

      if (noButtonEscapes === 3) {
        noButton.textContent = "точно нет?";
      } else if (noButtonEscapes === 6) {
        noButton.textContent = "я убегаю";
      } else if (noButtonEscapes === 9) {
        noButton.textContent = "лучше да";
      }
    }

    function createHeart(originX, originY) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.35 ? "❤️" : "💕";
      heart.style.left = `${originX}px`;
      heart.style.top = `${originY}px`;
      heart.style.setProperty("--x", `${(Math.random() - 0.5) * 260}px`);
      heart.style.setProperty("--y", `${-140 - Math.random() * 210}px`);
      heart.style.setProperty("--s", `${0.9 + Math.random() * 1.15}`);
      heart.style.setProperty("--r", `${-35 + Math.random() * 70}deg`);
      document.body.appendChild(heart);

      heart.addEventListener("animationend", () => {
        heart.remove();
      });
    }

    function burstHearts() {
      const rect = yesButton.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      for (let i = 0; i < 26; i += 1) {
        window.setTimeout(() => createHeart(originX, originY), i * 24);
      }
    }

    function acceptDate(event) {
      event.preventDefault();
      burstHearts();
      card.classList.add("accepted");
    }

    noButton.addEventListener("pointerdown", moveNoButton, { passive: false });
    noButton.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
    });

    yesButton.addEventListener("pointerup", acceptDate, { passive: false });
  </script>
</body>
</html>
