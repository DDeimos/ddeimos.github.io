<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Валентинка</title>
  <style>
    :root {
      --bg-start: #ffe0ec;
      --bg-end: #fff6f9;
      --card-bg: rgba(255, 255, 255, 0.82);
      --text: #3a1f2b;
      --accent: #ff4f8b;
      --accent-dark: #e83373;
      --secondary: #f4a7bf;
      --shadow: 0 20px 60px rgba(210, 62, 117, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 108, 157, 0.22), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(255, 174, 199, 0.24), transparent 26%),
        linear-gradient(145deg, var(--bg-start), var(--bg-end));
    }

    .card {
      width: min(100%, 430px);
      min-height: 620px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 22px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 32px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      text-align: center;
      overflow: hidden;
    }

    .cat-wrap {
      width: min(82vw, 300px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(160deg, #fff, #ffe8f0);
      box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.55), 0 16px 36px rgba(255, 79, 139, 0.18);
    }

    .cat {
      width: 86%;
      height: auto;
      filter: drop-shadow(0 12px 16px rgba(106, 38, 68, 0.18));
      transform-origin: center bottom;
      animation: floatCat 3.4s ease-in-out infinite;
    }

    @keyframes floatCat {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 9vw, 44px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      min-height: 58px;
      margin: 0;
      font-size: clamp(19px, 5.2vw, 24px);
      line-height: 1.32;
      font-weight: 650;
    }

    .actions {
      width: 100%;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 5;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 28px;
      font: inherit;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, opacity 160ms ease;
      touch-action: none;
    }

    button:active {
      transform: scale(0.96);
    }

    .yes {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      box-shadow: 0 12px 22px rgba(255, 79, 139, 0.3);
    }

    .yes:active {
      box-shadow: 0 8px 16px rgba(255, 79, 139, 0.24);
    }

    .no {
      color: #7b2b49;
      background: #fff;
      box-shadow: 0 10px 22px rgba(92, 40, 61, 0.12);
      will-change: left, top, transform;
    }

    .no.is-running {
      position: fixed;
      z-index: 20;
      transition: left 190ms ease-out, top 190ms ease-out, transform 190ms ease-out;
    }

    .final-message {
      display: none;
      margin: 0;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 850;
      line-height: 1.2;
      color: #bd245f;
      animation: popIn 420ms cubic-bezier(.2, 1.4, .32, 1) both;
    }

    .card.accepted .subtitle,
    .card.accepted .actions {
      display: none;
    }

    .card.accepted .final-message {
      display: block;
    }

    .card.accepted .cat {
      animation: happyCat 720ms ease-in-out infinite alternate;
    }

    @keyframes happyCat {
      from { transform: translateY(0) rotate(-3deg) scale(1); }
      to { transform: translateY(-10px) rotate(3deg) scale(1.035); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .heart {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      pointer-events: none;
      font-size: 24px;
      animation: flyHeart 1100ms ease-out forwards;
    }

    @keyframes flyHeart {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--s)) rotate(var(--r));
      }
    }

    .tiny-note {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      color: rgba(58, 31, 43, 0.48);
    }

    @media (max-height: 690px) {
      body {
        align-items: flex-start;
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .card {
        min-height: calc(100svh - 28px);
        gap: 16px;
        padding-top: 22px;
        padding-bottom: 40px;
      }

      .cat-wrap {
        width: min(68vw, 245px);
      }
    }
  </style>
</head>
<body>
  <main class="card" id="card" aria-live="polite">
    <div class="cat-wrap" aria-hidden="true">
      <svg class="cat" viewBox="0 0 420 420" role="img" aria-label="Котик с валентинкой" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#ff6fa3" />
            <stop offset="100%" stop-color="#ff2f75" />
          </linearGradient>
          <linearGradient id="catGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f4d7c7" />
          </linearGradient>
        </defs>

        <!-- tail -->
        <path d="M95 248c-38 3-61-19-56-48 4-25 28-38 52-28 18 8 26 27 17 43-7 12-22 17-35 10" fill="none" stroke="#d79f86" stroke-width="22" stroke-linecap="round" />

        <!-- body -->
        <ellipse cx="206" cy="260" rx="104" ry="118" fill="url(#catGradient)" />
        <ellipse cx="206" cy="288" rx="64" ry="70" fill="#fff6ef" opacity="0.86" />

        <!-- ears -->
        <path d="M128 152 112 74l68 44Z" fill="#f1c6b4" />
        <path d="M292 152 310 74l-70 44Z" fill="#f1c6b4" />
        <path d="M135 132 126 94l34 24Z" fill="#ffb1c9" opacity="0.72" />
        <path d="M284 132 294 94l-35 24Z" fill="#ffb1c9" opacity="0.72" />

        <!-- head -->
        <circle cx="210" cy="164" r="92" fill="url(#catGradient)" />

        <!-- face -->
        <circle cx="178" cy="158" r="9" fill="#3a1f2b" />
        <circle cx="244" cy="158" r="9" fill="#3a1f2b" />
        <path d="M211 177c-5 0-10-4-10-9 0-6 20-6 20 0 0 5-5 9-10 9Z" fill="#d35c7d" />
        <path d="M210 177c-6 13-20 15-28 7" fill="none" stroke="#3a1f2b" stroke-width="5" stroke-linecap="round" />
        <path d="M212 177c6 13 20 15 28 7" fill="none" stroke="#3a1f2b" stroke-width="5" stroke-linecap="round" />
        <circle cx="153" cy="178" r="16" fill="#ff9fbd" opacity="0.55" />
        <circle cx="268" cy="178" r="16" fill="#ff9fbd" opacity="0.55" />

        <!-- whiskers -->
        <path d="M152 172h-47M154 190l-45 14M268 172h47M266 190l45 14" stroke="#a87966" stroke-width="5" stroke-linecap="round" opacity="0.65" />

        <!-- arms -->
        <path d="M130 255c-30 18-45 44-35 64 9 17 32 14 51-5" fill="none" stroke="#e6b49c" stroke-width="24" stroke-linecap="round" />
        <path d="M287 246c33 7 56 28 58 54 2 21-17 30-42 19" fill="none" stroke="#e6b49c" stroke-width="24" stroke-linecap="round" />

        <!-- valentine heart -->
        <path d="M210 263c-32-32-78-56-78-98 0-25 20-45 45-45 16 0 28 8 36 21 8-13 20-21 36-21 25 0 45 20 45 45 0 42-46 66-84 98Z" fill="url(#heartGradient)" stroke="#ffffff" stroke-width="9" />
        <text x="212" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#fff">♥</text>
      </svg>
    </div>

    <h1>Валентинка</h1>
    <p class="subtitle" id="question">пойдём на свидание?</p>

    <div class="actions" id="actions">
      <button class="yes" id="yesButton" type="button">да</button>
      <button class="no" id="noButton" type="button">нет</button>
    </div>

    <p class="final-message" id="finalMessage">Я рад, тогда идём завтра вечером!</p>
    <p class="tiny-note">подсказка: правильный ответ только один ❤️</p>
  </main>

  <script>
    const card = document.getElementById("card");
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");

    let noButtonEscapes = 0;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function rectsOverlap(a, b, padding = 14) {
      return !(
        a.right + padding < b.left ||
        a.left - padding > b.right ||
        a.bottom + padding < b.top ||
        a.top - padding > b.bottom
      );
    }

    function moveNoButton(event) {
      event.preventDefault();
      event.stopPropagation();

      noButtonEscapes += 1;
      noButton.classList.add("is-running");

      const margin = 18;
      const buttonRect = noButton.getBoundingClientRect();
      const yesRect = yesButton.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      const maxLeft = viewportWidth - buttonRect.width - margin;
      const maxTop = viewportHeight - buttonRect.height - margin;

      const tapX = event.clientX || viewportWidth / 2;
      const tapY = event.clientY || viewportHeight / 2;
      const minDistance = Math.min(170, Math.max(95, viewportWidth * 0.28));

      let bestPosition = {
        left: clamp(viewportWidth - buttonRect.width - margin, margin, maxLeft),
        top: clamp(viewportHeight * 0.62, margin, maxTop)
      };

      for (let i = 0; i < 40; i += 1) {
        const left = margin + Math.random() * Math.max(1, maxLeft - margin);
        const top = margin + Math.random() * Math.max(1, maxTop - margin);
        const centerX = left + buttonRect.width / 2;
        const centerY = top + buttonRect.height / 2;
        const distanceFromTap = Math.hypot(centerX - tapX, centerY - tapY);

        const candidateRect = {
          left,
          top,
          right: left + buttonRect.width,
          bottom: top + buttonRect.height
        };

        if (distanceFromTap > minDistance && !rectsOverlap(candidateRect, yesRect, 18)) {
          bestPosition = { left, top };
          break;
        }
      }

      noButton.style.left = `${bestPosition.left}px`;
      noButton.style.top = `${bestPosition.top}px`;
      noButton.style.transform = `rotate(${noButtonEscapes % 2 === 0 ? "5deg" : "-5deg"})`;

      if (noButtonEscapes === 3) {
        noButton.textContent = "точно нет?";
      } else if (noButtonEscapes === 6) {
        noButton.textContent = "я убегаю";
      } else if (noButtonEscapes === 9) {
        noButton.textContent = "лучше да";
      }
    }

    function createHeart(originX, originY) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.35 ? "❤️" : "💕";
      heart.style.left = `${originX}px`;
      heart.style.top = `${originY}px`;
      heart.style.setProperty("--x", `${(Math.random() - 0.5) * 260}px`);
      heart.style.setProperty("--y", `${-140 - Math.random() * 210}px`);
      heart.style.setProperty("--s", `${0.9 + Math.random() * 1.15}`);
      heart.style.setProperty("--r", `${-35 + Math.random() * 70}deg`);
      document.body.appendChild(heart);

      heart.addEventListener("animationend", () => {
        heart.remove();
      });
    }

    function burstHearts() {
      const rect = yesButton.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      for (let i = 0; i < 26; i += 1) {
        window.setTimeout(() => createHeart(originX, originY), i * 24);
      }
    }

    function acceptDate(event) {
      event.preventDefault();
      burstHearts();
      card.classList.add("accepted");
    }

    noButton.addEventListener("pointerdown", moveNoButton, { passive: false });
    noButton.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
    });

    yesButton.addEventListener("pointerup", acceptDate, { passive: false });
  </script>
</body>
</html>
