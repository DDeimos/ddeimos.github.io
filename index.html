<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сказочные открытки</title>
  <style>
    :root {
      --paper-strong: rgba(255, 250, 236, 0.97);
      --text: #281b18;
      --soft-text: rgba(40, 27, 24, 0.68);
      --button-shadow: 0 12px 26px rgba(60, 29, 34, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 230, 174, 0.28), transparent 18%),
        radial-gradient(circle at 20% 86%, rgba(168, 91, 95, 0.18), transparent 24%),
        linear-gradient(160deg, #10182a 0%, #273d39 50%, #6d5646 100%);
    }

    .app {
      width: min(100%, 480px);
    }

    .shell {
      position: relative;
      width: 100%;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 18px 28px;
      border: 1px solid rgba(255, 245, 221, 0.55);
      border-radius: 34px;
      background: linear-gradient(180deg, var(--paper-strong), rgba(245, 226, 190, 0.88));
      box-shadow: 0 24px 70px rgba(9, 16, 29, 0.38);
      overflow: hidden;
      text-align: center;
      animation: screenIn 360ms ease both;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 24% 18%, rgba(255, 236, 178, 0.35), transparent 18%),
        radial-gradient(circle at 82% 8%, rgba(255, 200, 189, 0.22), transparent 22%);
      pointer-events: none;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1,
    p,
    a {
      position: relative;
      z-index: 2;
    }

    h1 {
      max-width: 390px;
      margin: 0;
      font-size: clamp(34px, 9vw, 48px);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    .subtitle {
      max-width: 370px;
      margin: 0;
      font-size: clamp(16px, 4.4vw, 19px);
      line-height: 1.38;
      color: var(--soft-text);
      font-weight: 650;
    }

    .story-list {
      position: relative;
      z-index: 2;
      width: 100%;
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .story-link {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 24px;
      color: var(--text);
      background: rgba(255, 247, 223, 0.86);
      box-shadow: var(--button-shadow);
      text-decoration: none;
      text-align: left;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .story-link:active {
      transform: scale(0.98);
      box-shadow: 0 8px 16px rgba(60, 29, 34, 0.14);
    }

    .story-link-title {
      display: block;
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .story-link-meta {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.35;
      color: var(--soft-text);
      font-weight: 650;
    }

    .empty-note {
      margin: 0;
      padding: 14px 18px;
      border-radius: 20px;
      color: rgba(40, 27, 24, 0.58);
      background: rgba(255, 255, 255, 0.32);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 650;
    }

    .empty-note code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95em;
    }

    .dates-link {
      align-self: flex-end;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 2px 2px 0 0;
      padding: 8px 14px;
      border: 1px solid rgba(109, 86, 70, 0.18);
      border-radius: 999px;
      color: var(--soft-text);
      background: rgba(255, 255, 255, 0.42);
      box-shadow: 0 6px 16px rgba(60, 29, 34, 0.1);
      font-size: 13px;
      line-height: 1;
      font-weight: 800;
      text-decoration: none;
      transition: transform 160ms ease, color 160ms ease, background 160ms ease;
    }

    .dates-link:hover,
    .dates-link:focus-visible {
      color: var(--text);
      background: rgba(255, 255, 255, 0.7);
    }

    .dates-link:active {
      transform: scale(0.97);
    }

    @media (max-height: 720px) {
      body {
        align-items: flex-start;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .shell {
        min-height: calc(100svh - 20px);
        gap: 12px;
        padding-top: 18px;
        padding-bottom: 20px;
      }

      h1 {
        font-size: clamp(27px, 7.4vw, 36px);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell" aria-label="Список сказочных открыток">
      <h1>Сказочные открытки</h1>
      <p class="subtitle">Здесь будут храниться все истории. Выбери сказку, чтобы открыть отдельную открытку.</p>

      <nav class="story-list" aria-label="Список сказок">
        <a class="story-link" href="./stories/raven-bat/">
          <span class="story-link-title">Ворон и летучая мышка</span>
          <span class="story-link-meta">Открытая поляна среди хвойного леса</span>
        </a>
      </nav>

      <p class="empty-note">Новые сказки можно добавлять отдельными папками в <code>stories/</code>, не удаляя старые открытки.</p>
      <a class="dates-link" href="./dates/index.html">свидания</a>
    </section>
  </main>
</body>
</html>
